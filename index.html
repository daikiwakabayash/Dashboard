                        const hasActivity = recentPaidSubIds.has(sub.id) || (sub.monthlyPrice > 0 && toYM(sub.startDate) === sqMonth);
                        const isActiveAtMonth = hasActivity && start && start <= monthEnd && sub.status !== 'PAUSED' && (
                            sub.status === 'ACTIVE' ||
                            (subEndDate && new Date(subEndDate) > monthEnd)
                        );
                        if (isActiveAtMonth) {
                            activeList.push(entry);
                        }

                        // 解約: 選択月内に解約されたサブスクのみ（PAUSED除外）
                        if ((sub.status === 'CANCELED' || sub.status === 'DEACTIVATED') && toYM(subEndDate) === sqMonth) {
                            canceledList.push(entry);
                        }

                        // 一時停止: 選択月内に一時停止されたサブスク
                        if (sub.status === 'PAUSED' && toYM(subEndDate) === sqMonth) {
                            pausedList.push(entry);
                        }

                        // 一時停止からの復帰: ACTIVEで、選択月にPAID請求があり、前月にPAID請求がなく、
                        // それ以前にPAID実績がある（＝一時停止期間を経て復帰した）サブスク
                        if (sub.status === 'ACTIVE' && paidByMonth[sqMonth] && !paidByMonth[prevYM] && paidMonths.length > 1) {
                            const sortedMonths = [...paidMonths].sort();
                            const firstPaidMonth = sortedMonths[0];
                            // 新規ではなく過去に決済実績がある（初回決済月が選択月より前）
                            if (firstPaidMonth < sqMonth) {
                                resumedList.push({ ...entry, resumedDate: sqMonth });
                            }
                        }

                        // 払戻し・期限超過: 選択月のインボイスのみ
                        for (const inv of subInvs) {
                            if (seenInv[inv.id]) continue;
                            const invYM = inv.createdAt ? toYM(inv.createdAt) : null;
                            const dueYM = inv.dueDate ? toYM(inv.dueDate) : null;
                            if ((inv.status === 'REFUNDED' || inv.status === 'PARTIALLY_REFUNDED') && invYM === sqMonth) {
                                seenInv[inv.id] = true;
                                refundedList.push({ ...inv, name, plan: planName });
                            }
                            if ((inv.status === 'UNPAID' || inv.status === 'PAYMENT_PENDING') && dueYM === sqMonth) {
                                seenInv[inv.id] = true;
                                overdueList.push({ ...inv, name, plan: planName });
                            }
                        }
                    }
                }

                // 重複排除: 同一顧客IDのサブスクをマージ（アクティブ会員数KPIと一致させる）
                // 同一顧客の複数プランは1行にまとめ、決済額は合算
                const dedup = (list) => {
                    const mergeEntry = (existing, entry) => {
                        // プラン名をマージ（異なるプランは「/」で結合）
                        if (entry.plan && existing.plan && entry.plan !== existing.plan && !existing.plan.includes(entry.plan)) {
                            existing.plan += ` / ${entry.plan}`;
                        }
                        // 月額をマージ（異なるプランの合計）
                        existing.monthlyPrice = (existing.monthlyPrice || 0) + (entry.monthlyPrice || 0);
                        // 月別決済額をマージ（同月は合算＝複数プラン分を加算）
                        const merged = { ...(existing.paidByMonth || {}) };
                        for (const [m, amt] of Object.entries(entry.paidByMonth || {})) {
                            merged[m] = (merged[m] || 0) + amt;
                        }
                        existing.paidByMonth = merged;
                        const months = Object.keys(merged);
                        existing.paidMonths = months;
                        existing.paidCount = months.length;
                        existing.paidTotal = months.reduce((s, m) => s + merged[m], 0);
                        // 最も早い入会日を採用
                        if (entry.startDate && (!existing.startDate || entry.startDate < existing.startDate)) {
                            existing.startDate = entry.startDate;
                        }
                        // アクティブなサブスクがあれば解約日をクリア
                        if (!entry.canceledDate) {
                            existing.canceledDate = null;
                        }
                        existing.subCount = (existing.subCount || 1) + 1;
                    };

                    // 第1パス: customerIdで重複排除
                    const map = {};
                    for (const entry of list) {
                        const key = entry.customerId;
                        if (map[key]) {
                            mergeEntry(map[key], entry);
                        } else {
                            map[key] = { ...entry, subCount: 1 };
                        }
                    }
                    const firstPass = Object.values(map);

                    // 第2パス: 同一名前+同一プラン+同一月額の重複排除
                    // （異なるcustomerIdで同一人物が登録されているケースに対応）
                    const nameMap = {};
                    for (const entry of firstPass) {
                        const nameKey = `${entry.name}|${entry.plan}|${entry.monthlyPrice}`;
                        if (nameMap[nameKey]) {
                            // 同名・同プラン・同月額 → 重複とみなしマージ（月額は加算しない＝同一プランの重複）
                            const existing = nameMap[nameKey];
                            // 月別決済額: 既存のデータを優先（同じ月は上書きしない）
                            const merged = { ...(existing.paidByMonth || {}) };
                            for (const [m, amt] of Object.entries(entry.paidByMonth || {})) {
                                if (!merged[m]) merged[m] = amt;
                            }
                            existing.paidByMonth = merged;
                            const months = Object.keys(merged);
                            existing.paidMonths = months;
                            existing.paidCount = months.length;
                            existing.paidTotal = months.reduce((s, m) => s + merged[m], 0);
                            // 最も早い入会日を採用
                            if (entry.startDate && (!existing.startDate || entry.startDate < existing.startDate)) {
                                existing.startDate = entry.startDate;
                            }
                            if (!entry.canceledDate) {
                                existing.canceledDate = null;
                            }
                            existing.subCount = (existing.subCount || 1) + (entry.subCount || 1);
                        } else {
                            nameMap[nameKey] = { ...entry };
                        }
                    }
                    return Object.values(nameMap);
                };

                // プラン変更検出: 顧客ごとの最初のサブスク開始日を全店舗横断で構築
                const custFirstStart = {};
                for (const s of allSubs) {
                    if (!s.startDate || !s.customerId) continue;
                    if (!custFirstStart[s.customerId] || s.startDate < custFirstStart[s.customerId]) {
                        custFirstStart[s.customerId] = s.startDate;
                    }
                }

                // 新規入会・プラン変更: 選択月に入会したサブスク（フォールバック時は空）
                const newMonthList = [];
                const planChangeList = [];
                if (!useInvFallback) {
                    for (const sub of storeSubs) {
                        if (toYM(sub.startDate) !== sqMonth) continue;
                        const name = cust[sub.customerId] ? cust[sub.customerId].name : sub.customerId || '不明';
                        const planName = plans[sub.planVariationId] ? plans[sub.planVariationId].name : '不明';
                        const subInvs = invBySub[sub.id] || [];
                        const paid = subInvs.filter(i => i.status === 'PAID');
                        const paidByMonth = {};
                        for (const inv of paid) {
                            const ym = toYM(inv.createdAt);
                            if (ym && !paidByMonth[ym]) paidByMonth[ym] = inv.amount;
                        }
                        const paidMonths = Object.keys(paidByMonth);
                        const entry = {
                            id: sub.id, customerId: sub.customerId, name, plan: planName,
                            paidCount: paidMonths.length,
                            paidTotal: paidMonths.reduce((s, m) => s + paidByMonth[m], 0),
                            paidByMonth, paidMonths,
                            startDate: sub.startDate, canceledDate: sub.canceledDate,
                            monthlyPrice: sub.monthlyPrice,
                        };
                        // プラン変更判定: 顧客の最初のサブスク開始月と異なる場合
                        const firstDate = custFirstStart[sub.customerId];
                        const isChange = firstDate && toYM(firstDate) !== toYM(sub.startDate);
                        if (isChange) {
                            planChangeList.push(entry);
                        } else {
                            newMonthList.push(entry);
                        }
                    }
                }

                return { activeList: dedup(activeList), newMonthList: dedup(newMonthList), planChangeList: dedup(planChangeList), canceledList: dedup(canceledList), pausedList: dedup(pausedList), resumedList: dedup(resumedList), refundedList, overdueList };
            }, [sqPreprocessed, sqStore, sqMonth, sqStoreLocationIds]);

            const sqSortedList = useMemo(() => {
                if (!sqCustomerData) return [];
                const lists = { active: sqCustomerData.activeList, newMonth: sqCustomerData.newMonthList, planChange: sqCustomerData.planChangeList, canceled: sqCustomerData.canceledList, paused: sqCustomerData.pausedList, resumed: sqCustomerData.resumedList, refunded: sqCustomerData.refundedList, overdue: sqCustomerData.overdueList };
                const list = [...(lists[sqTab] || [])];
                const { key, dir } = sqSort;
                list.sort((a, b) => {
                    const va = a[key]; const vb = b[key];
                    if (va == null && vb == null) return 0;
                    if (va == null) return 1;
                    if (vb == null) return -1;
                    if (typeof va === 'string') return dir === 'asc' ? va.localeCompare(vb, 'ja') : vb.localeCompare(va, 'ja');
                    return dir === 'asc' ? va - vb : vb - va;
                });
                return list;
            }, [sqCustomerData, sqTab, sqSort]);

            const sqHandleSort = (key) => {
                setSqSort(prev => ({ key, dir: prev.key === key ? (prev.dir === 'asc' ? 'desc' : 'asc') : 'desc' }));
            };

            // チャートドリルダウンリスト（sqPreprocessedを活用して重複計算を排除）
            const sqDrilldownList = useMemo(() => {
                if (!sqDrilldown || !sqPreprocessed) return [];
                const { month, type } = sqDrilldown;
                const { cust, plansMap: plans, invBySub, subs: allSubs, filtered: storeSubs } = sqPreprocessed;
                const toYM = d => { if (!d) return null; const dt = new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; };
                // プラン変更検出用: 顧客ごとの最初のサブスク開始日
                const custFirst = {};
                for (const s of allSubs) {
                    if (!s.startDate || !s.customerId) continue;
                    if (!custFirst[s.customerId] || s.startDate < custFirst[s.customerId]) {
                        custFirst[s.customerId] = s.startDate;
                    }
                }
                let matched;
                if (type === 'new') {
                    // 新規入会のみ（プラン変更を除外）
                    matched = storeSubs.filter(s => {
                        if (toYM(s.startDate) !== month) return false;
                        const firstDate = custFirst[s.customerId];
                        return !firstDate || toYM(firstDate) === toYM(s.startDate);
                    });
                } else {
                    matched = storeSubs.filter(s => (s.status === 'CANCELED' || s.status === 'DEACTIVATED' || s.status === 'PAUSED') && toYM(s.canceledDate || s.pausedDate) === month);
                }
                const list = matched.map(sub => {
                    const name = cust[sub.customerId] ? cust[sub.customerId].name : sub.customerId || '不明';
                    const planName = plans[sub.planVariationId] ? plans[sub.planVariationId].name : '不明';
                    const subInvs = invBySub[sub.id] || [];
                    const paid = subInvs.filter(i => i.status === 'PAID');
                    return {
                        id: sub.id, name, plan: planName,
                        paidCount: paid.length,
                        paidTotal: paid.reduce((s, i) => s + i.amount, 0),
                        startDate: sub.startDate, canceledDate: sub.canceledDate || sub.pausedDate,
                        monthlyPrice: sub.monthlyPrice,
                        isPaused: sub.status === 'PAUSED',
                    };
                });
                // 重複排除（名前+月額でマージ）
                const map = {};
                for (const entry of list) {
                    const key = `${entry.name}|${entry.monthlyPrice}`;
                    if (map[key]) {
                        map[key].paidCount += entry.paidCount;
                        map[key].paidTotal += entry.paidTotal;
                    } else {
                        map[key] = { ...entry };
                    }
                }
                return Object.values(map);
            }, [sqDrilldown, sqPreprocessed]);

            // マーケティングドロップダウンのクリック外検知
            useEffect(() => {
                const handleMktClickOutside = (event) => {
                    if (mktBranchRef.current && !mktBranchRef.current.contains(event.target)) setMktBranchMenuOpen(false);
                    if (mktStaffRef.current && !mktStaffRef.current.contains(event.target)) setMktStaffMenuOpen(false);
                    if (mktMediaRef.current && !mktMediaRef.current.contains(event.target)) setMktMediaMenuOpen(false);
                };
                document.addEventListener("mousedown", handleMktClickOutside);
                return () => document.removeEventListener("mousedown", handleMktClickOutside);
            }, []);

            // UI状態が変更されたらlocalStorageに保存
            useEffect(() => {
                // 初回ロード時は保存しない（データ取得後に初期値が設定されるため）
                if (!uiStateLoaded && !startMonth) return;

                const uiState = {
                    currentPage,
                    startMonth,
                    endMonth,
                    startDate: startDate ? startDate.toISOString() : null,
                    endDate: endDate ? endDate.toISOString() : null,
                    selectedBranches,
                    selectedStaffNames,
                    selectedMetrics,
                    // マーケティングダッシュボード状態
                    mktSelectedBranches,
                    mktSelectedStaff,
                    mktSelectedMedia,
                    mktSelectedMonth,
                    mktEndMonth,
                    mktActiveTab
                };
                saveUIState(uiState);
                setUiStateLoaded(true);
            }, [currentPage, startMonth, endMonth, startDate, endDate, selectedBranches, selectedStaffNames, selectedMetrics, mktSelectedBranches, mktSelectedStaff, mktSelectedMedia, mktSelectedMonth, mktEndMonth, mktActiveTab]);

            const months = useMemo(() => {
                return Array.from(new Set(rawData.map(d => d.month))).sort((a, b) => {
                    const [ay, am] = a.replace('年', '-').replace('月', '').split('-');
                    const [by, bm] = b.replace('年', '-').replace('月', '').split('-');
                    return new Date(by, bm - 1) - new Date(ay, am - 1);
                });
            }, [rawData]);

            const allBranches = useMemo(() => {
                const spreadsheetBranches = rawData.map(d => d.branch);
                const squareBranches = (sqData && sqData.stores) ? sqData.stores.map(s => s.name) : [];
                return Array.from(new Set([...spreadsheetBranches, ...squareBranches]));
            }, [rawData, sqData]);

            const filteredBranches = useMemo(() => {
                if (!branchSearchTerm) return allBranches;
                return allBranches.filter(branch =>
                    branch.toLowerCase().includes(branchSearchTerm.toLowerCase())
                );
            }, [allBranches, branchSearchTerm]);

            const allStaffNames = useMemo(() => Array.from(new Set(rawData.map(d => d.name))), [rawData]);

            const filteredStaffNames = useMemo(() => {
                if (!staffSearchTerm) return allStaffNames;
                return allStaffNames.filter(name =>
                    name.toLowerCase().includes(staffSearchTerm.toLowerCase())
                );
            }, [allStaffNames, staffSearchTerm]);

            // 期間に基づいて対象月を計算
            const targetMonths = useMemo(() => {
                if (!startMonth || !endMonth) return [];

                const startIndex = months.indexOf(startMonth);
                const endIndex = months.indexOf(endMonth);

                if (startIndex === -1 || endIndex === -1) return [];

                // startIndexからendIndexまでの範囲を取得（逆順の可能性も考慮）
                const minIndex = Math.min(startIndex, endIndex);
                const maxIndex = Math.max(startIndex, endIndex);

                return months.slice(minIndex, maxIndex + 1).reverse();
            }, [startMonth, endMonth, months]);

            const toggleBranch = (branch) => {
                setSelectedBranches(prev =>
                    prev.includes(branch)
                        ? prev.filter(b => b !== branch)
                        : [...prev, branch]
                );
            };

            const toggleStaff = (staffName) => {
                setSelectedStaffNames(prev =>
                    prev.includes(staffName)
                        ? prev.filter(n => n !== staffName)
                        : [...prev, staffName]
                );
            };

            const fixPercent = (val) => {
                if (val === undefined || val === null) return 0;
                const num = val < 1 && val > 0 ? val * 100 : val;
                return Math.floor(num);
            };

            const filteredData = useMemo(() => {
                return rawData.filter(d => {
                    const matchMonth = targetMonths.includes(d.month);
                    const matchBranch = selectedBranches.includes(d.branch);

                    // スタッフ名フィルタリング: selectedStaffNamesが空の場合は全て表示
                    const matchStaff = selectedStaffNames.length === 0 || selectedStaffNames.includes(d.name);

                    // 旧searchTermも互換性のために維持（店舗・スタッフ両方を検索）
                    const matchSearch = searchTerm === "" ||
                                        d.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                        d.branch.toLowerCase().includes(searchTerm.toLowerCase());

                    return matchMonth && matchBranch && matchStaff && matchSearch;
                });
            }, [rawData, targetMonths, selectedBranches, selectedStaffNames, searchTerm]);

            // ===== マーケティング用 useMemo =====
            const mktMonths = useMemo(() => {
                return sortMonths(Array.from(new Set(mktData.map(d => d.month).filter(Boolean))));
            }, [mktData]);

            const mktAllBranches = useMemo(() => Array.from(new Set(mktData.map(d => d.branch).filter(Boolean))), [mktData]);
            const mktAllStaff = useMemo(() => Array.from(new Set(mktData.map(d => d.staff).filter(Boolean))), [mktData]);
            const mktAllMedia = useMemo(() => Array.from(new Set(mktData.map(d => d.media).filter(m => m && m !== '全媒体合計'))), [mktData]);

            // 選択月範囲内の月リスト
            const mktTargetMonths = useMemo(() => {
                if (!mktSelectedMonth || !mktEndMonth) return mktMonths;
                const startIdx = mktMonths.indexOf(mktSelectedMonth);
                const endIdx = mktMonths.indexOf(mktEndMonth);
                if (startIdx === -1 || endIdx === -1) return mktMonths;
                const minIdx = Math.min(startIdx, endIdx);
                const maxIdx = Math.max(startIdx, endIdx);
                return mktMonths.slice(minIdx, maxIdx + 1);
            }, [mktSelectedMonth, mktEndMonth, mktMonths]);

            // メニューデータを解析（数値まとめAG-AP列 or J列ベース、期間フィルター対応）
            const analyzeMenuData = useMemo(() => {
                try {
                    const sourceData = menuRawData && menuRawData.length > 0 ? menuRawData : null;
                    if (!sourceData) return null;

                    // 期間フィルター適用
                    const filteredByPeriod = mktTargetMonths.length > 0
                        ? sourceData.filter(m => m.month && mktTargetMonths.includes(m.month))
                        : sourceData;

                    if (filteredByPeriod.length === 0) return null;

                    // 国内/海外フィルター適用
                    const filteredByRegion = menuRegionFilter === 'all' ? filteredByPeriod
                        : menuRegionFilter === 'overseas' ? filteredByPeriod.filter(m => isOverseasMenu(m.menuName))
                        : filteredByPeriod.filter(m => !isOverseasMenu(m.menuName));

                    if (filteredByRegion.length === 0) return null;

                    // 対象月リスト（ソート済み）
                    const activeMonths = [...new Set(filteredByRegion.map(m => m.month))].sort();

                    // 同名データを月をまたいで統合するヘルパー
                    const mergeByName = (rows) => {
                        const map = {};
                        rows.forEach(m => {
                            if (!map[m.menuName]) {
                                map[m.menuName] = { menuName: m.menuName, reservations: 0, actualVisits: 0, advanceCancels: 0, sameDayCancels: 0, enrollments: 0, reviews: 0 };
                            }
                            const t = map[m.menuName];
                            t.reservations += m.reservations || 0;
                            t.actualVisits += m.actualVisits || 0;
                            t.advanceCancels += m.advanceCancels || 0;
                            t.sameDayCancels += m.sameDayCancels || 0;
                            t.enrollments += m.enrollments || 0;
                            t.reviews += m.reviews || 0;
                        });
                        return Object.values(map).filter(m => m.reservations > 0).map(m => calcMenuMetrics(m));
                    };

                    let menuList, byPrice, byBodyPart, bySource;

                    // J列データ（type付き）
                    const hasTypes = filteredByRegion.some(m => m.type);

                    if (hasTypes) {
                        const menuRows = filteredByRegion.filter(m => m.type === 'menu');
                        menuList = mergeByName(menuRows).sort((a, b) => b.reservations - a.reservations);
                    } else {
                        menuList = mergeByName(filteredByRegion).sort((a, b) => b.reservations - a.reservations);
                    }

                    // 全メニューに price, bodyPart を付与
                    menuList = menuList.map(m => ({
                        ...m,
                        price: extractPriceFromMenu(m.menuName),
                        bodyPart: extractBodyPartFromMenu(m.menuName),
                        source: extractSourceFromMenu(m.menuName),
                        isOverseas: isOverseasMenu(m.menuName)
                    }));

                    // 価格帯別集計（合計）
                    const priceGroups = {};
                    menuList.forEach(m => { if (m.price > 0) { if (!priceGroups[m.price]) priceGroups[m.price] = []; priceGroups[m.price].push(m); }});
                    byPrice = Object.entries(priceGroups).map(([p, menus]) => ({
                        label: `¥${Number(p).toLocaleString()}円訴求`, price: Number(p), ...aggregateMenus(menus)
                    })).sort((a, b) => a.price - b.price);

                    // 症状別集計（合計）
                    const bodyPartGroups = {};
                    menuList.forEach(m => { if (m.bodyPart !== 'その他') { if (!bodyPartGroups[m.bodyPart]) bodyPartGroups[m.bodyPart] = []; bodyPartGroups[m.bodyPart].push(m); }});
                    byBodyPart = Object.entries(bodyPartGroups).map(([part, menus]) => ({
                        label: `${part} 訴求`, bodyPart: part, ...aggregateMenus(menus)
                    })).sort((a, b) => b.reservations - a.reservations);

                    // 集客媒体別
                    const sourceGroups = {};
                    menuList.forEach(m => {
                        const match = m.menuName.match(/《([^》]+?)(?:新規限定|限定)?》/);
                        const source = match ? match[1] : 'その他';
                        if (!sourceGroups[source]) sourceGroups[source] = [];
                        sourceGroups[source].push(m);
                    });
                    bySource = Object.entries(sourceGroups)
                        .map(([source, menus]) => ({ label: `${source}経由`, source, menus: menus.sort((a, b) => b.reservations - a.reservations), ...aggregateMenus(menus) }))
                        .sort((a, b) => b.reservations - a.reservations);

                    // ===== 価格帯 × 月別クロス集計 =====
                    const byPriceMonthly = {};
                    filteredByRegion.forEach(m => {
                        const price = extractPriceFromMenu(m.menuName);
                        if (price <= 0) return;
                        const key = price;
                        if (!byPriceMonthly[key]) byPriceMonthly[key] = {};
                        if (!byPriceMonthly[key][m.month]) byPriceMonthly[key][m.month] = { reservations: 0, actualVisits: 0, advanceCancels: 0, sameDayCancels: 0, enrollments: 0, reviews: 0 };
                        const t = byPriceMonthly[key][m.month];
                        t.reservations += m.reservations || 0;
                        t.actualVisits += m.actualVisits || 0;
                        t.advanceCancels += m.advanceCancels || 0;
                        t.sameDayCancels += m.sameDayCancels || 0;
                        t.enrollments += m.enrollments || 0;
                        t.reviews += m.reviews || 0;
                    });
                    const priceMonthlyData = Object.entries(byPriceMonthly).map(([price, months]) => ({
                        label: `¥${Number(price).toLocaleString()}円`, price: Number(price),
                        months: Object.fromEntries(Object.entries(months).map(([mo, d]) => [mo, calcMenuMetrics(d)]))
                    })).sort((a, b) => a.price - b.price);

                    // ===== 症状 × 月別クロス集計 =====
                    const byBodyPartMonthly = {};
                    filteredByRegion.forEach(m => {
                        const part = extractBodyPartFromMenu(m.menuName);
                        if (part === 'その他') return;
                        if (!byBodyPartMonthly[part]) byBodyPartMonthly[part] = {};
                        if (!byBodyPartMonthly[part][m.month]) byBodyPartMonthly[part][m.month] = { reservations: 0, actualVisits: 0, advanceCancels: 0, sameDayCancels: 0, enrollments: 0, reviews: 0 };
                        const t = byBodyPartMonthly[part][m.month];
                        t.reservations += m.reservations || 0;
                        t.actualVisits += m.actualVisits || 0;
                        t.advanceCancels += m.advanceCancels || 0;
                        t.sameDayCancels += m.sameDayCancels || 0;
                        t.enrollments += m.enrollments || 0;
                        t.reviews += m.reviews || 0;
                    });
                    const bodyPartMonthlyData = Object.entries(byBodyPartMonthly).map(([part, months]) => ({
                        label: part,
                        months: Object.fromEntries(Object.entries(months).map(([mo, d]) => [mo, calcMenuMetrics(d)]))
                    })).sort((a, b) => {
                        const aTotal = Object.values(a.months).reduce((s, d) => s + d.reservations, 0);
                        const bTotal = Object.values(b.months).reduce((s, d) => s + d.reservations, 0);
                        return bTotal - aTotal;
                    });

                    return { menuList, byPrice, byBodyPart, bySource, priceMonthlyData, bodyPartMonthlyData, activeMonths };
                } catch (error) {
                    console.error('❌ Menu analysis error:', error);
                    return null;
                }
            }, [menuRawData, mktTargetMonths, menuRegionFilter]);

            const mktFiltered = useMemo(() => {
                return mktData.filter(d => {
                    // 全媒体合計レコードは集計で二重計上されるため除外
                    if (d.media === '全媒体合計') return false;
                    const matchMonth = mktTargetMonths.length === 0 || mktTargetMonths.includes(d.month);
                    const matchBranch = mktSelectedBranches.length === 0 || mktSelectedBranches.includes(d.branch);
                    const matchStaff = mktSelectedStaff.length === 0 || mktSelectedStaff.includes(d.staff);
                    const matchMedia = mktSelectedMedia.length === 0 || mktSelectedMedia.includes(d.media);
                    return matchMonth && matchBranch && matchStaff && matchMedia;
                });
            }, [mktData, mktTargetMonths, mktSelectedBranches, mktSelectedStaff, mktSelectedMedia]);

            // マーケティングKPI集計
            const mktStats = useMemo(() => {
                const totalNew = mktFiltered.reduce((a, d) => a + (d.newCount || 0), 0);
                const totalReservations = mktFiltered.reduce((a, d) => a + (d.reservationCount || 0), 0);
                const totalEnroll = mktFiltered.reduce((a, d) => a + (d.enrollCount || 0), 0);
                const totalCancel = mktFiltered.reduce((a, d) => a + (d.cancelCount || 0), 0);
                const totalAdSpend = mktFiltered.reduce((a, d) => a + (d.adSpend || 0), 0);
                const totalRevenue = mktFiltered.reduce((a, d) => a + (d.revenue || 0), 0);
                const totalClicks = mktFiltered.reduce((a, d) => a + (d.clicks || 0), 0);
                const totalImpressions = mktFiltered.reduce((a, d) => a + (d.impressions || 0), 0);
                const totalCv = mktFiltered.reduce((a, d) => a + (d.cvCount || 0), 0);
                const totalReferrals = mktFiltered.reduce((a, d) => a + (d.referralCount || 0), 0);
                const totalReviews = mktFiltered.reduce((a, d) => a + (d.reviewCount || 0), 0);

                const avgCpa = totalNew > 0 ? Math.round(totalAdSpend / totalNew) : 0;
                const reservationCpa = totalReservations > 0 ? Math.round(totalAdSpend / totalReservations) : 0;
                const visitCpa = totalNew > 0 ? Math.round(totalAdSpend / totalNew) : 0;
                const enrollRate = totalNew > 0 ? Math.round((totalEnroll / totalNew) * 100) : 0;
                const cancelDenom = totalReservations > 0 ? totalReservations : totalNew;
                const cancelRate = cancelDenom > 0 ? Math.round((totalCancel / cancelDenom) * 100) : 0;
                const cvr = totalClicks > 0 ? Math.round((totalCv / totalClicks) * 1000) / 10 : 0;
                const ctr = totalImpressions > 0 ? Math.round((totalClicks / totalImpressions) * 1000) / 10 : 0;
                const roas = totalAdSpend > 0 ? Math.round((totalRevenue / totalAdSpend) * 100) : 0;
                const avgPrice = totalNew > 0 ? Math.round(totalRevenue / totalNew) : 0;

                return { totalNew, totalReservations, totalEnroll, totalCancel, totalAdSpend, totalRevenue, totalClicks, totalImpressions, totalCv, totalReferrals, totalReviews, avgCpa, reservationCpa, visitCpa, enrollRate, cancelRate, cvr, ctr, roas, avgPrice };
            }, [mktFiltered]);

            // 店舗別集計
            const mktByBranch = useMemo(() => {
                const map = {};
                mktFiltered.forEach(d => {
                    const key = d.branch || '不明';
                    if (!map[key]) map[key] = { branch: key, area: d.area || '', newCount: 0, reservationCount: 0, enrollCount: 0, cancelCount: 0, adSpend: 0, revenue: 0, reviewCount: 0, records: 0 };
                    map[key].newCount += d.newCount || 0;
                    map[key].reservationCount += d.reservationCount || 0;
                    map[key].enrollCount += d.enrollCount || 0;
                    map[key].cancelCount += d.cancelCount || 0;
                    map[key].adSpend += d.adSpend || 0;
                    map[key].revenue += d.revenue || 0;
                    map[key].reviewCount += d.reviewCount || 0;
                    map[key].records++;
                });
                return Object.values(map).map(b => {
                    const cancelDenom = b.reservationCount > 0 ? b.reservationCount : b.newCount;
                    return {
                        ...b,
                        cpa: b.newCount > 0 ? Math.round(b.adSpend / b.newCount) : 0,
                        reservationCpa: b.reservationCount > 0 ? Math.round(b.adSpend / b.reservationCount) : 0,
                        visitCpa: b.newCount > 0 ? Math.round(b.adSpend / b.newCount) : 0,
                        enrollRate: b.newCount > 0 ? Math.round((b.enrollCount / b.newCount) * 100) : 0,
                        cancelRate: cancelDenom > 0 ? Math.round((b.cancelCount / cancelDenom) * 100) : 0,
                        roas: b.adSpend > 0 ? Math.round((b.revenue / b.adSpend) * 100) : 0,
                    };
                }).sort((a, b) => b.newCount - a.newCount);
            }, [mktFiltered]);

            // スタッフ別集計
            const mktByStaff = useMemo(() => {
                const map = {};
                mktFiltered.forEach(d => {
                    const key = d.staff || '不明';
                    if (!map[key]) map[key] = { staff: key, branch: d.branch || '', newCount: 0, reservationCount: 0, enrollCount: 0, cancelCount: 0, adSpend: 0, revenue: 0 };
                    map[key].newCount += d.newCount || 0;
                    map[key].reservationCount += d.reservationCount || 0;
                    map[key].enrollCount += d.enrollCount || 0;
                    map[key].cancelCount += d.cancelCount || 0;
                    map[key].adSpend += d.adSpend || 0;
                    map[key].revenue += d.revenue || 0;
                });
                return Object.values(map).map(s => {
                    const cancelDenom = s.reservationCount > 0 ? s.reservationCount : s.newCount;
                    return {
                        ...s,
                        cpa: s.newCount > 0 ? Math.round(s.adSpend / s.newCount) : 0,
                        enrollRate: s.newCount > 0 ? Math.round((s.enrollCount / s.newCount) * 100) : 0,
                        cancelRate: cancelDenom > 0 ? Math.round((s.cancelCount / cancelDenom) * 100) : 0,
                    };
                }).sort((a, b) => b.newCount - a.newCount);
            }, [mktFiltered]);

            // 媒体別集計
            const mktByMedia = useMemo(() => {
                const map = {};
                mktFiltered.forEach(d => {
                    const key = d.media || '不明';
                    if (!map[key]) map[key] = { media: key, newCount: 0, reservationCount: 0, enrollCount: 0, cancelCount: 0, adSpend: 0, revenue: 0, clicks: 0, impressions: 0, cvCount: 0, reviewCount: 0 };
                    map[key].newCount += d.newCount || 0;
                    map[key].reservationCount += d.reservationCount || 0;
                    map[key].enrollCount += d.enrollCount || 0;
                    map[key].cancelCount += d.cancelCount || 0;
                    map[key].adSpend += d.adSpend || 0;
                    map[key].revenue += d.revenue || 0;
                    map[key].clicks += d.clicks || 0;
                    map[key].impressions += d.impressions || 0;
                    map[key].cvCount += d.cvCount || 0;
                    map[key].reviewCount += d.reviewCount || 0;
                });
                return Object.values(map).map(m => {
                    const cancelDenom = m.reservationCount > 0 ? m.reservationCount : m.newCount;
                    return {
                        ...m,
                        cpa: m.newCount > 0 ? Math.round(m.adSpend / m.newCount) : 0,
                        reservationCpa: m.reservationCount > 0 ? Math.round(m.adSpend / m.reservationCount) : 0,
                        visitCpa: m.newCount > 0 ? Math.round(m.adSpend / m.newCount) : 0,
                        enrollRate: m.newCount > 0 ? Math.round((m.enrollCount / m.newCount) * 100) : 0,
                        cancelRate: cancelDenom > 0 ? Math.round((m.cancelCount / cancelDenom) * 100) : 0,
                        cvr: m.clicks > 0 ? Math.round((m.cvCount / m.clicks) * 1000) / 10 : 0,
                        ctr: m.impressions > 0 ? Math.round((m.clicks / m.impressions) * 1000) / 10 : 0,
                        roas: m.adSpend > 0 ? Math.round((m.revenue / m.adSpend) * 100) : 0,
                    };
                }).sort((a, b) => b.newCount - a.newCount);
            }, [mktFiltered]);

            // CPAアラート: META/TikTok のネットCPA（来店CPA）が¥5,000超の店舗を検出
            const CPA_ALERT_THRESHOLD = 5000;
            const CPA_ALERT_MEDIA = ['META', 'meta', 'Meta', 'Facebook', 'Instagram', 'TIKTOK', 'TikTok', 'tiktok', 'Tiktok'];
            const cpaAlerts = useMemo(() => {
                if (mktData.length === 0) return [];
                // 最新月を特定
                const allMonths = [...new Set(mktData.map(d => d.month).filter(Boolean))].sort();
                const latestMonth = allMonths[allMonths.length - 1];
                if (!latestMonth) return [];
                // 最新月のMETA/TikTokデータを店舗×媒体で集計
                const latestData = mktData.filter(d => d.month === latestMonth && d.media && d.media !== '全媒体合計');
                const map = {};
                latestData.forEach(d => {
                    // META系（META, Facebook, Instagram）とTikTok系をグループ化
                    let mediaGroup = null;
                    const m = (d.media || '').trim();
                    if (/^(META|meta|Meta|Facebook|Instagram)$/i.test(m)) mediaGroup = 'META';
                    else if (/^(TIKTOK|TikTok|tiktok|Tiktok)$/i.test(m)) mediaGroup = 'TikTok';
                    if (!mediaGroup) return;
                    const key = (d.branch || '不明') + '|||' + mediaGroup;
                    if (!map[key]) map[key] = { branch: d.branch || '不明', mediaGroup, adSpend: 0, newCount: 0 };
                    map[key].adSpend += d.adSpend || 0;
                    map[key].newCount += d.newCount || 0;
                });
                const alerts = [];
                Object.values(map).forEach(item => {
                    if (item.newCount <= 0) return;
                    const cpa = Math.round(item.adSpend / item.newCount);
                    if (cpa > CPA_ALERT_THRESHOLD) {
                        alerts.push({
                            branch: item.branch,
                            media: item.mediaGroup,
                            cpa,
                            adSpend: item.adSpend,
                            newCount: item.newCount,
                            month: latestMonth,
                            threshold: CPA_ALERT_THRESHOLD,
                        });
                    }
                });
                return alerts.sort((a, b) => b.cpa - a.cpa);
            }, [mktData]);

            // ソート済み店舗データ
            const sortedMktByBranch = useMemo(() => {
                return [...mktByBranch].sort((a, b) => {
                    const av = a[branchSortKey] ?? 0;
                    const bv = b[branchSortKey] ?? 0;
                    return branchSortOrder === 'asc' ? av - bv : bv - av;
                });
            }, [mktByBranch, branchSortKey, branchSortOrder]);

            // ソート済み媒体データ
            const sortedMktByMedia = useMemo(() => {
                return [...mktByMedia].sort((a, b) => {
                    const av = a[mediaSortKey] ?? 0;
                    const bv = b[mediaSortKey] ?? 0;
                    return mediaSortOrder === 'asc' ? av - bv : bv - av;
                });
            }, [mktByMedia, mediaSortKey, mediaSortOrder]);

            // 月別推移データ
            const mktMonthlyTrend = useMemo(() => {
                const map = {};
                mktFiltered.forEach(d => {
                    const key = d.month || '不明';
                    if (!map[key]) map[key] = { month: key, newCount: 0, reservationCount: 0, enrollCount: 0, cancelCount: 0, adSpend: 0, revenue: 0 };
                    map[key].newCount += d.newCount || 0;
                    map[key].reservationCount += d.reservationCount || 0;
                    map[key].enrollCount += d.enrollCount || 0;
                    map[key].cancelCount += d.cancelCount || 0;
                    map[key].adSpend += d.adSpend || 0;
                    map[key].revenue += d.revenue || 0;
                });
                return Object.values(map).sort((a, b) => parseMonthKey(a.month) - parseMonthKey(b.month)).map(m => {
                    const cancelDenom = m.reservationCount > 0 ? m.reservationCount : m.newCount;
                    return {
                        ...m,
                        cpa: m.newCount > 0 ? Math.round(m.adSpend / m.newCount) : 0,
                        reservationCpa: m.reservationCount > 0 ? Math.round(m.adSpend / m.reservationCount) : 0,
                        visitCpa: m.newCount > 0 ? Math.round(m.adSpend / m.newCount) : 0,
                        enrollRate: m.newCount > 0 ? Math.round((m.enrollCount / m.newCount) * 100) : 0,
                        cancelRate: cancelDenom > 0 ? Math.round((m.cancelCount / cancelDenom) * 100) : 0,
                    };
                });
            }, [mktFiltered]);

            // 媒体別 × 月別クロス集計
            const mktMediaMonthly = useMemo(() => {
                if (mktFiltered.length === 0) return { mediaList: [], months: [], data: {} };
                const mediaSet = new Set();
                const monthSet = new Set();
                const data = {};
                mktFiltered.forEach(d => {
                    const media = d.media || '不明';
                    const month = d.month || '不明';
                    mediaSet.add(media);
                    monthSet.add(month);
                    const key = media + '|||' + month;
                    if (!data[key]) data[key] = { newCount: 0, reservationCount: 0, enrollCount: 0, cancelCount: 0, adSpend: 0, revenue: 0, reviewCount: 0 };
                    data[key].newCount += d.newCount || 0;
                    data[key].reservationCount += d.reservationCount || 0;
                    data[key].enrollCount += d.enrollCount || 0;
                    data[key].cancelCount += d.cancelCount || 0;
                    data[key].adSpend += d.adSpend || 0;
                    data[key].revenue += d.revenue || 0;
                    data[key].reviewCount += d.reviewCount || 0;
                });
                const months = [...monthSet].sort((a, b) => parseMonthKey(a) - parseMonthKey(b));
                const mediaList = [...mediaSet].sort((a, b) => {
                    const aTotal = months.reduce((s, mo) => s + ((data[a+'|||'+mo] || {}).newCount || 0), 0);
                    const bTotal = months.reduce((s, mo) => s + ((data[b+'|||'+mo] || {}).newCount || 0), 0);
                    return bTotal - aTotal;
                });
                // calc rates
                Object.keys(data).forEach(k => {
                    const d = data[k];
                    const cancelDenom = d.reservationCount > 0 ? d.reservationCount : d.newCount;
                    d.cpa = d.newCount > 0 ? Math.round(d.adSpend / d.newCount) : 0;
                    d.reservationCpa = d.reservationCount > 0 ? Math.round(d.adSpend / d.reservationCount) : 0;
                    d.visitCpa = d.newCount > 0 ? Math.round(d.adSpend / d.newCount) : 0;
                    d.enrollRate = d.newCount > 0 ? Math.round((d.enrollCount / d.newCount) * 100) : 0;
                    d.cancelRate = cancelDenom > 0 ? Math.round((d.cancelCount / cancelDenom) * 100) : 0;
                    d.roas = d.adSpend > 0 ? Math.round((d.revenue / d.adSpend) * 100) : 0;
                });
                return { mediaList, months, data };
            }, [mktFiltered]);

            // 業界ベンチマーク評価関数
            const benchmarkGrade = (metric, value, isLowerBetter) => {
                const bm = SEITAI_BENCHMARKS[metric];
                if (!bm || value === null || value === undefined) return { grade: '-', color: 'slate', label: '' };
                if (isLowerBetter) {
                    if (value <= bm.excellent) return { grade: 'S', color: 'emerald', label: '業界トップ' };
                    if (value <= bm.good) return { grade: 'A', color: 'blue', label: '良好' };
                    if (value <= bm.average) return { grade: 'B', color: 'amber', label: '平均的' };
                    if (value <= bm.poor) return { grade: 'C', color: 'orange', label: '要改善' };
                    return { grade: 'D', color: 'rose', label: '要対策' };
                } else {
                    if (value >= bm.excellent) return { grade: 'S', color: 'emerald', label: '業界トップ' };
                    if (value >= bm.good) return { grade: 'A', color: 'blue', label: '良好' };
                    if (value >= bm.average) return { grade: 'B', color: 'amber', label: '平均的' };
                    if (value >= bm.poor) return { grade: 'C', color: 'orange', label: '要改善' };
                    return { grade: 'D', color: 'rose', label: '要対策' };
                }
            };

            // AI分析: 総合スコア・詳細アドバイス・改善インパクト
            const mktAiAnalysis = useMemo(() => {
                if (mktByBranch.length === 0) return [];

                const avgCpa = mktStats.avgCpa;
                const avgEnroll = mktStats.enrollRate;
                const avgCancel = mktStats.cancelRate;
                const avgNew = mktByBranch.reduce((a, b) => a + b.newCount, 0) / mktByBranch.length;
                const avgReview = mktByBranch.reduce((a, b) => a + (b.reviewCount || 0), 0) / mktByBranch.length;

                return mktByBranch.map(branch => {
                    const issues = [];
                    const scores = { severity: 0 };
                    const strengths = [];
                    const actions = []; // 具体的アクションプラン

                    // === 総合ヘルススコア（100点満点）===
                    let healthScore = 50; // ベーススコア

                    // --- CPA分析 ---
                    const cpaGrade = benchmarkGrade('cpa', branch.cpa, true);
                    if (branch.cpa > 0 && avgCpa > 0) {
                        const cpaRatio = branch.cpa / avgCpa;
                        if (cpaRatio > 1.5) {
                            const savingPotential = Math.round((branch.cpa - avgCpa) * branch.newCount);
                            issues.push({ type: 'danger', metric: 'CPA', message: `CPA ¥${branch.cpa.toLocaleString()} は全体平均の${Math.round(cpaRatio * 100)}%`, suggestion: '広告クリエイティブの見直し、ターゲティングの精度向上を検討' });
                            actions.push({ priority: 1, action: 'CPA改善', detail: `CPAを平均水準まで下げれば月間約¥${savingPotential.toLocaleString()}の広告費削減が見込める`, impact: '高', category: '広告費' });
                            scores.severity += 3; healthScore -= 15;
                        } else if (cpaRatio > 1.2) {
                            issues.push({ type: 'warning', metric: 'CPA', message: `CPA ¥${branch.cpa.toLocaleString()} はやや高め（平均: ¥${avgCpa.toLocaleString()}）`, suggestion: 'LP改善やキーワード最適化で改善可能' });
                            scores.severity += 1; healthScore -= 5;
                        } else if (cpaRatio < 0.8) {
                            strengths.push(`CPA ¥${branch.cpa.toLocaleString()} が優秀（平均比${Math.round(cpaRatio * 100)}%）`);
                            healthScore += 10;
                        }
                    }

                    // --- 入会率分析 ---
                    const enrollGrade = benchmarkGrade('enrollRate', branch.enrollRate, false);
                    if (avgEnroll > 0 && branch.newCount >= 3) {
                        const enrollDiff = avgEnroll - branch.enrollRate;
                        if (enrollDiff > 20) {
                            const potentialEnroll = Math.round(branch.newCount * (avgEnroll / 100)) - branch.enrollCount;
                            issues.push({ type: 'danger', metric: '入会率', message: `入会率${branch.enrollRate}%は全体平均${avgEnroll}%を大きく下回る`, suggestion: 'カウンセリングトークの改善、初回体験メニューの見直し' });
                            actions.push({ priority: 1, action: '入会率改善', detail: `平均水準に改善すれば月${potentialEnroll > 0 ? potentialEnroll : 1}名の追加入会が見込める`, impact: '高', category: '成約力' });
                            scores.severity += 3; healthScore -= 15;
                        } else if (enrollDiff > 10) {
                            issues.push({ type: 'warning', metric: '入会率', message: `入会率${branch.enrollRate}%は平均${avgEnroll}%を下回る`, suggestion: 'スタッフ研修の実施やトークスクリプトの標準化' });
                            actions.push({ priority: 2, action: '接客研修', detail: 'カウンセリング力を強化し入会率を5%改善する', impact: '中', category: '成約力' });
                            scores.severity += 2; healthScore -= 8;
                        } else if (branch.enrollRate > avgEnroll + 10) {
                            strengths.push(`入会率${branch.enrollRate}%が高水準（+${branch.enrollRate - avgEnroll}pt）`);
                            healthScore += 10;
                        }
                    }

                    // --- キャンセル率分析 ---
                    const cancelGrade = benchmarkGrade('cancelRate', branch.cancelRate, true);
                    if (branch.reservationCount >= 3) {
                        if (branch.cancelRate > 25) {
                            const lostPatients = Math.round(branch.reservationCount * (branch.cancelRate - avgCancel) / 100);
                            issues.push({ type: 'danger', metric: 'キャンセル率', message: `キャンセル率${branch.cancelRate}%は深刻なレベル`, suggestion: 'リマインド連絡の強化、予約確認フローの見直し' });
                            actions.push({ priority: 1, action: 'キャンセル対策', detail: `キャンセル率を平均に改善すれば月${lostPatients > 0 ? lostPatients : 1}名の来院増`, impact: '高', category: '来院率' });
                            scores.severity += 3; healthScore -= 12;
                        } else if (branch.cancelRate > avgCancel + 8) {
                            issues.push({ type: 'warning', metric: 'キャンセル率', message: `キャンセル率${branch.cancelRate}%は平均${avgCancel}%を上回る`, suggestion: 'LINE予約リマインドの導入を検討' });
                            actions.push({ priority: 2, action: 'リマインド導入', detail: '予約前日のLINE通知でキャンセル率5%改善を目指す', impact: '中', category: '来院率' });
                            scores.severity += 1; healthScore -= 5;
                        } else if (branch.cancelRate <= 5) {
                            strengths.push(`キャンセル率${branch.cancelRate}%が非常に低い`);
                            healthScore += 8;
                        }
                    }

                    // --- 集客数分析 ---
                    if (avgNew > 0 && branch.newCount > 0) {
                        if (branch.newCount < avgNew * 0.5) {
                            issues.push({ type: 'warning', metric: '集客数', message: `実来院${branch.newCount}名は平均${Math.round(avgNew)}名の半分以下`, suggestion: 'エリアマーケティング・MEO・チラシの強化' });
                            actions.push({ priority: 2, action: '集客強化', detail: `来院数を平均に近づけるため、広告予算の増額やMEO対策を検討`, impact: '中', category: '集客' });
                            scores.severity += 2; healthScore -= 10;
                        } else if (branch.newCount > avgNew * 1.5) {
                            strengths.push(`来院数${branch.newCount}名が平均の${Math.round(branch.newCount / avgNew * 100)}%で好調`);
                            healthScore += 8;
                        }
                    }

                    // --- ROAS分析 ---
                    const roasGrade = benchmarkGrade('roas', branch.roas, false);
                    if (branch.roas > 0 && branch.roas < 100) {

                    // スコアをクランプ

                // Monthly trend (全媒体合算)

                const mediaMonthlyData = {};

                // 自動インサイト生成

                        else if (cpaDiff > 0) insights.push({ type: 'warn', text: `来店CPA: ${prev.month} ¥${prev.visitCpa.toLocaleString()} → ${curr.month} ¥${curr.visitCpa.toLocaleString()}（+${cpaPct}% 悪化）` });
                    }

                    if (prev.reservationCpa > 0 && curr.reservationCpa > 0) {

                        else if (cpaDiff > 0) insights.push({ type: 'warn', text: `予約CPA: ${prev.month} ¥${prev.reservationCpa.toLocaleString()} → ${curr.month} ¥${curr.reservationCpa.toLocaleString()}（+${cpaPct}% 悪化）` });
                    }

                    // 実来院数変化

                                    text: `${media}: 来店CPA ${pm} ¥${pd.visitCpa.toLocaleString()} → ${cm} ¥${cd.visitCpa.toLocaleString()}（${diff < 0 ? '' : '+'}${pct}%）`
                                });

                total.cpa = total.newCount > 0 ? Math.round(total.adSpend / total.newCount) : 0;

            const stats = useMemo(() => {

            // 福利厚生詳細計算 (Q-AA列 11項目)

            const allowanceTracking = useMemo(() => {

                        totalUsed,
                        remaining,

                    '売上', '新規', '入会', '退会', '離反', 'スタッフ', '店舗', '院',
                    'cpa', 'roas', 'cvr', 'ctr', '広告', '媒体', 'meta', 'hpb', 'google', 'line', 'tt', 'チラシ',
                    '予約', 'キャンセル', '口コミ', 'レビュー', '実績', '成績', 'パフォーマンス',
                    'マーケ', 'クリック', 'インプレッション', '集客', '来院', '来店',
                    '比較', 'ランキング', 'トップ', '一番', '改善', 'アドバイス',
                    '月', '年', '期間', '推移', '分析', '数字', 'データ', '合計', '平均',
                    '何人', 'いくら', '金額', '費用', '予算', '利益', '客単価',
                    '蒲田', '池袋', '千葉', '千葉駅', '池尻大橋', '札幌', '名古屋', '大阪', '福岡', '横浜', '白石', '恵比寿',
                    '全店', '全体', 'naoru', 'サブスク', 'mrr', '解約', 'churn'
                ];
                const hasDataKeyword = dataKeywords.some(kw => lowerQ.includes(kw));
                if (!hasDataKeyword) {
                    return 'off_topic';
                }

                // スタッフリスト要求
                if (lowerQ.includes('スタッフ') && (lowerQ.includes('教えて') || lowerQ.includes('誰') || lowerQ.includes('一覧') || lowerQ.includes('リスト') || lowerQ.includes('は？') || lowerQ.includes('は?') || lowerQ.match(/スタッフ[はを]/) || lowerQ.endsWith('スタッフ？') || lowerQ.endsWith('スタッフ?'))) {
                    return 'staff_list';
                }

                // 特定の指標要求
                if (lowerQ.includes('売上は') || lowerQ.includes('売上を') || lowerQ.match(/いくら|金額/)) {
                    return 'sales_query';
                }
                if (lowerQ.includes('新規') && (lowerQ.includes('何人') || lowerQ.includes('数'))) {
                    return 'new_customer_query';
                }
                if (lowerQ.includes('入会率')) {
                    return 'enrollment_rate_query';
                }
                if (lowerQ.includes('退会率')) {
                    return 'churn_rate_query';
                }
                if (lowerQ.includes('マーク') || lowerQ.includes('成績') || lowerQ.includes('実績') || lowerQ.includes('パフォーマンス')) {
                    return 'performance_summary';
                }

                // 指標別ランキング・フィルタリング要求（「CPA悪い店舗は？」「入会率低い店舗」等）
                const metricRankingKeywords = [
                    'cpa', 'roas', 'cvr', 'ctr', '入会率', '退会率', '離反率', 'キャンセル率',
                    '売上', '新規', '生産性', '口コミ', 'レビュー', '広告費', '客単価'
                ];
                const evalKeywords = ['悪い', '良い', '高い', '低い', 'いい', 'ワースト', 'ベスト',
                                      '最悪', '最高', '一番悪い', '一番良い', '一番高い', '一番低い'];
                const storeKeywords = ['店舗', '院', '店', 'どこ'];
                const hasMetric = metricRankingKeywords.some(kw => lowerQ.includes(kw));
                const hasEval = evalKeywords.some(kw => lowerQ.includes(kw));
                const hasStoreRef = storeKeywords.some(kw => lowerQ.includes(kw));
                if (hasMetric && (hasEval || hasStoreRef)) {
                    return 'metric_ranking';
                }

                // 比較要求
                if (lowerQ.includes('比較') || lowerQ.includes('どっち') || lowerQ.includes('vs')) {
                    return 'comparison';
                }

                // ランキング要求
                if (lowerQ.includes('ランキング') || lowerQ.includes('トップ') || lowerQ.includes('一番')) {
                    return 'ranking';
                }

                // 推奨・アドバイス要求
                if (lowerQ.includes('改善') || lowerQ.includes('アドバイス') || lowerQ.includes('提案') || lowerQ.includes('どうしたら')) {
                    return 'advice';
                }

                // 詳細分析（デフォルト）
                return 'detailed_analysis';
            };

            // チャット分析機能
            const analyzeChatQuestion = (question, currentContext) => {
                const lowerQ = question.toLowerCase();
                console.log('🤖 Chat question:', question);
                console.log('📌 Current context:', currentContext);

                // コンテキストリセットキーワード
                const resetKeywords = ['リセット', 'クリア', '最初から', '新しい質問'];
                const shouldReset = resetKeywords.some(keyword => lowerQ.includes(keyword));

                if (shouldReset) {
                    console.log('🔄 Context reset requested');
                    return {
                        success: true,
                        message: '会話の文脈をリセットしました。新しい質問をどうぞ。',
                        resetContext: true
                    };
                }

                // 質問の種類を分類
                const questionType = classifyQuestion(question);
                console.log('🔍 Question type:', questionType);

                // オフトピック検出: データに関係ない質問は明確に断る
                if (questionType === 'off_topic') {
                    return {
                        success: true,
                        message: 'すみません、その質問にはお答えできません。\n\n私はNAORUの経営データ・マーケティングデータに基づいた分析のみ対応しています。\n\n質問例:\n・「蒲田の1月の売上は？」\n・「全店舗のCPAを比較して」\n・「池袋院の入会率は？」\n・「Meta広告の実績を教えて」',
                        newContext: currentContext
                    };
                }

                // 店舗名の抽出（より柔軟なマッチング）
                let targetBranch = null;

                // まず完全一致を試みる
                for (const branch of allBranches) {
                    if (lowerQ.includes(branch.toLowerCase())) {
                        targetBranch = branch;
                        console.log('✓ Branch matched (exact):', branch);
                        break;
                    }
                }

                // 次に部分一致を試みる（「千葉」→「千葉駅院」など）
                if (!targetBranch) {
                    for (const branch of allBranches) {
                        // 「院」「駅」などを除いた基本名
                        const branchBase = branch.replace(/駅?院$/, '');
                        if (branchBase.length >= 2 && lowerQ.includes(branchBase.toLowerCase())) {
                            targetBranch = branch;
                            console.log('✓ Branch matched (base name):', branch, 'from', branchBase);
                            break;
                        }
                    }
                }

                // さらに柔軟なマッチング（エリア名など）
                if (!targetBranch) {
                    for (const branch of allBranches) {
                        // 最初の2文字でマッチング（「千葉」「池袋」など）
                        if (branch.length >= 2) {
                            const firstTwo = branch.substring(0, 2);
                            if (lowerQ.includes(firstTwo.toLowerCase())) {
                                targetBranch = branch;
                                console.log('✓ Branch matched (first chars):', branch, 'from', firstTwo);
                                break;
                            }
                        }
                    }
                }

                // 「全店舗」「全体」などのキーワード検出
                const isAllBranches = lowerQ.includes('全店舗') || lowerQ.includes('全体') || lowerQ.includes('全院');
                if (isAllBranches) {
                    targetBranch = null;
                    console.log('✓ All branches mode (explicit)');
                }

                // 店舗が指定されていない場合、前回の文脈を使用
                const usingContextBranch = (targetBranch === null && !isAllBranches && currentContext.branch);
                if (usingContextBranch) {
                    targetBranch = currentContext.branch;
                    console.log('✓ Using context branch:', targetBranch);
                }

                // 月の抽出（より柔軟なパターンマッチング）
                let targetMonth = null;
                let usingContextMonth = false;

                // パターン1: 2026年1月、26年1月
                let monthMatch = lowerQ.match(/(\d{2,4})年(\d{1,2})月/);
                if (monthMatch) {
                    let year = monthMatch[1];
                    if (year.length === 2) {
                        year = `20${year}`;
                    }
                    const month = parseInt(monthMatch[2]);
                    targetMonth = `${year}年${month}月`;
                    console.log('✓ Month matched (year-month):', targetMonth);
                }

                // パターン2: 1月（現在年または最新データの年を使用）
                if (!targetMonth) {
                    monthMatch = lowerQ.match(/(\d{1,2})月/);
                    if (monthMatch) {
                        const month = parseInt(monthMatch[1]);

                        // データから年を推測（最も頻出する年を使用）
                        const yearCounts = {};
                        rawData.forEach(d => {
                            if (d.month) {
                                const yearMatch = d.month.match(/(\d{4})年/);
                                if (yearMatch) {
                                    yearCounts[yearMatch[1]] = (yearCounts[yearMatch[1]] || 0) + 1;
                                }
                            }
                        });

                        const mostCommonYear = Object.keys(yearCounts).sort((a, b) => yearCounts[b] - yearCounts[a])[0] || new Date().getFullYear().toString();
                        targetMonth = `${mostCommonYear}年${month}月`;
                        console.log('✓ Month matched (month only, inferred year):', targetMonth);
                    }
                }

                // 月が指定されていない場合、前回の文脈を使用
                if (!targetMonth && currentContext.month) {
                    targetMonth = currentContext.month;
                    usingContextMonth = true;
                    console.log('✓ Using context month:', targetMonth);
                }

                // マーケティングデータか経営データかを判定（より精密に）
                let data = [];
                let useMktData = false;

                // マーケティング関連キーワード
                const mktKeywords = ['媒体', '広告', 'マーケ', 'cpa', 'cvr', 'ctr', 'roas', 'クリック', 'インプレッション',
                                     '予約', 'キャンセル', 'meta', 'google', 'line', 'hpb'];

                if (mktKeywords.some(keyword => lowerQ.includes(keyword))) {
                    data = mktData;
                    useMktData = true;
                    console.log('✓ Using marketing data');
                } else {
                    data = rawData;
                    console.log('✓ Using operational data');
                }

                // データが空の場合、もう一方のデータソースを試す
                if (data.length === 0) {
                    data = useMktData ? rawData : mktData;
                    useMktData = !useMktData;
                    console.log(`⚠️ Switching to ${useMktData ? 'marketing' : 'operational'} data (original was empty)`);
                }

                // データフィルタリング
                let filteredAnalysisData = data.filter(d => {
                    const branchMatch = !targetBranch || d.branch === targetBranch;
                    const monthMatch = !targetMonth || d.month === targetMonth;
                    return branchMatch && monthMatch;
                });

                console.log(`📊 Filtered data: ${filteredAnalysisData.length} records (from ${data.length} total)`);
                if (filteredAnalysisData.length > 0) {
                    console.log('Sample record:', JSON.stringify(filteredAnalysisData[0]));
                }

                // metric_ranking の場合、店舗未指定でも全店舗データで処理するためスキップ
                if (questionType === 'metric_ranking' && filteredAnalysisData.length === 0 && !targetBranch) {
                    // 月未指定の場合は最新月のデータを使用
                    const availableMonths = Array.from(new Set(data.map(d => d.month).filter(Boolean))).sort().reverse();
                    if (availableMonths.length > 0 && !targetMonth) {
                        targetMonth = availableMonths[0];
                    }
                    filteredAnalysisData = data.filter(d => !targetMonth || d.month === targetMonth);
                }

                // データが見つからない場合、明確化のための質問またはエラーメッセージ
                if (filteredAnalysisData.length === 0) {
                    const availableBranches = Array.from(new Set(data.map(d => d.branch).filter(Boolean)));
                    const availableMonths = Array.from(new Set(data.map(d => d.month).filter(Boolean))).sort().reverse();

                    // 店舗も月も指定されていない場合、質問で返す
                    if (!targetBranch && !targetMonth) {
                        // metric_ranking以外の場合のみ明確化を求める
                        let clarifyMsg = `質問の内容を詳しく教えてください。\n\n`;
                        clarifyMsg += `どの店舗について知りたいですか？\n`;
                        clarifyMsg += availableBranches.slice(0, 8).map(b => `・${b}`).join('\n');
                        if (availableBranches.length > 8) clarifyMsg += `\n・その他 ${availableBranches.length - 8} 店舗...`;
                        clarifyMsg += `\n\nまた、どの期間について知りたいですか？\n`;
                        clarifyMsg += `例: 2026年1月、26年1月、1月など`;

                        return {
                            success: true,
                            message: clarifyMsg,
                            newContext: { branch: null, month: null }
                        };
                    }

                    // 店舗だけ指定されていて月がない場合
                    if (targetBranch && !targetMonth) {
                        let clarifyMsg = `${targetBranch}についてですね。\n\nどの期間について分析しますか？\n\n`;
                        clarifyMsg += `利用可能な月:\n`;
                        clarifyMsg += availableMonths.slice(0, 6).map(m => `・${m}`).join('\n');
                        if (availableMonths.length > 6) clarifyMsg += `\n・その他 ${availableMonths.length - 6} ヶ月...`;

                        return {
                            success: true,
                            message: clarifyMsg,
                            newContext: { branch: targetBranch, month: null }
                        };
                    }

                    // それ以外の場合、エラーメッセージ
                    let errorMsg = `${targetBranch || ''}${targetMonth || ''}のデータが見つかりませんでした。\n\n`;

                    if (targetBranch && !availableBranches.includes(targetBranch)) {
                        errorMsg += `店舗「${targetBranch}」が見つかりません。\n`;
                        errorMsg += `利用可能な店舗: ${availableBranches.slice(0, 5).join('、')}${availableBranches.length > 5 ? '...' : ''}\n\n`;
                    }

                    if (targetMonth && !availableMonths.includes(targetMonth)) {
                        errorMsg += `月「${targetMonth}」のデータがありません。\n`;
                        errorMsg += `利用可能な月: ${availableMonths.slice(0, 5).join('、')}${availableMonths.length > 5 ? '...' : ''}\n\n`;
                    }

                    errorMsg += `質問の表記を確認してください。例:\n`;
                    errorMsg += `・「池袋院の2026年1月の売上は？」\n`;
                    errorMsg += `・「全店舗の1月を分析して」\n`;
                    errorMsg += `・「千葉駅院の広告効率は？」`;

                    return {
                        success: false,
                        message: errorMsg,
                        newContext: { branch: targetBranch, month: targetMonth }
                    };
                }

                // 質問タイプに応じた分析実行
                let result;

                if (questionType === 'metric_ranking') {
                    // 指標別店舗ランキング（全店舗比較）
                    // 店舗指定がない場合は全店舗データを使う
                    let rankingData = filteredAnalysisData;
                    if (!targetBranch && !isAllBranches) {
                        // 月だけでフィルタリング（全店舗を対象に）
                        rankingData = data.filter(d => {
                            return !targetMonth || d.month === targetMonth;
                        });
                    }
                    result = generateMetricRankingResponse(rankingData, question, targetMonth);
                } else if (questionType === 'staff_list') {
                    // スタッフリストを返す（経営データのみ）
                    result = generateStaffListResponse(filteredAnalysisData, targetBranch, targetMonth);
                } else if (questionType === 'sales_query') {
                    // 売上情報を返す（経営データのみ）
                    result = generateSalesQueryResponse(filteredAnalysisData, targetBranch, targetMonth);
                } else if (questionType === 'performance_summary') {
                    // パフォーマンスサマリーを返す（経営データのみ）
                    result = generatePerformanceSummaryResponse(filteredAnalysisData, targetBranch, targetMonth);
                } else {
                    // 詳細分析を返す（データソースに応じて）
                    result = useMktData
                        ? analyzeMarketingData(filteredAnalysisData, targetBranch, targetMonth)
                        : analyzeOperationalData(filteredAnalysisData, targetBranch, targetMonth);
                }

                // 文脈を使用した場合、メッセージの先頭に注記を追加
                if (result.success && (usingContextBranch || usingContextMonth)) {
                    const contextParts = [];
                    if (usingContextBranch) contextParts.push(`店舗: ${targetBranch}`);
                    if (usingContextMonth) contextParts.push(`期間: ${targetMonth}`);

                    result.message = `💡 次の質問でも同じ${contextParts.join('、')}を使用します。変更する場合は明示してください。\n\n` + result.message;
                }

                // 新しい文脈を含めて返す
                return {
                    ...result,
                    newContext: { branch: targetBranch, month: targetMonth }
                };
            };

            // 経営データの分析
            const analyzeOperationalData = (data, branch, month) => {
                if (data.length === 0) {
                    return {
                        success: false,
                        message: `${branch || '指定された条件'}の${month || '期間'}のデータが見つかりませんでした。店舗名や月の表記を確認してください。`
                    };
                }

                // 集計（正しいフィールド名を使用）
                console.log('===== ANALYSIS DEBUG START =====');
                console.log(`Analyzing ${data.length} records for branch: ${branch}, month: ${month}`);

                // データのサンプルを表示
                if (data.length > 0) {
                    console.log('Sample data records:');
                    data.slice(0, Math.min(5, data.length)).forEach((d, i) => {
                        console.log(`Record ${i + 1}:`, {
                            name: d.name,
                            branch: d.branch,
                            month: d.month,
                            individualSales: d.individualSales,
                            recurringSales: d.recurringSales
                        });
                    });
                }

                // 数値のバリデーション関数
                const validateNumber = (num) => {
                    if (num === null || num === undefined || isNaN(num) || !isFinite(num)) return 0;
                    return Math.round(num); // 小数点以下を丸める
                };

                const totalIndividualSales = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.individualSales), 0));
                const totalRecurringSales = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.recurringSales), 0));

                console.log('Aggregation results:');
                console.log(`- Individual Sales: ¥${totalIndividualSales.toLocaleString()}`);
                console.log(`- Recurring Sales: ¥${totalRecurringSales.toLocaleString()}`);
                console.log(`- Total: ¥${(totalIndividualSales + totalRecurringSales).toLocaleString()}`);
                console.log('===== ANALYSIS DEBUG END =====');

                // 総売上は個別売上のみ（ユーザーの定義に合わせる）
                const totalSales = totalIndividualSales;

                const totalNewCount = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.newCount), 0));
                const totalNewEnroll = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.newEnroll), 0));
                const totalChurnCount = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.churnCount), 0));
                const totalPrevMembers = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.prevMembers), 0));
                const totalProductivity = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.productivity), 0));
                const totalGReviews = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.gReviews), 0));
                const totalHReviews = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.hReviews), 0));
                const totalReferrals = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.referrals), 0));

                // 平均値計算
                const avgNewCount = totalNewCount / data.length;
                const avgEnrollRate = totalNewCount > 0 ? (totalNewEnroll / totalNewCount) * 100 : 0;
                const avgChurnRate = totalPrevMembers > 0 ? (totalChurnCount / totalPrevMembers) * 100 : 0;
                const avgProductivity = totalProductivity / data.length;
                const avgNewPrice = totalNewCount > 0 ? data.reduce((sum, d) => sum + (d.newAvgPrice || 0), 0) / data.length : 0;

                // スタッフ別分析
                const staffMap = {};
                data.forEach(d => {
                    const key = d.name || '不明';
                    if (!staffMap[key]) {
                        staffMap[key] = {
                            name: key,
                            sales: 0,
                            newCount: 0,
                            newEnroll: 0,
                            productivity: 0,
                            records: 0
                        };
                    }
                    staffMap[key].sales += validateNumber(d.individualSales);
                    staffMap[key].newCount += validateNumber(d.newCount);
                    staffMap[key].newEnroll += validateNumber(d.newEnroll);
                    staffMap[key].productivity += validateNumber(d.productivity);
                    staffMap[key].records++;
                });

                const staffList = Object.values(staffMap).sort((a, b) => b.sales - a.sales);
                const topStaff = staffList[0];
                const lowStaff = staffList[staffList.length - 1];

                const issues = [];
                const strengths = [];
                const recommendations = [];

                // 売上分析（より詳細に）
                const avgSalesPerRecord = totalSales / data.length;
                if (avgSalesPerRecord < 800000) {
                    issues.push(`平均売上が${Math.round(avgSalesPerRecord / 10000)}万円と目標を下回っています`);
                    recommendations.push('新規顧客獲得数の増加と継続会員の維持に注力してください');
                } else if (avgSalesPerRecord >= 1200000) {
                    strengths.push(`平均売上${Math.round(avgSalesPerRecord / 10000)}万円と優秀な業績です`);
                }

                // 新規数分析
                if (avgNewCount < 10) {
                    issues.push(`新規顧客数が月平均${avgNewCount.toFixed(1)}人と少ない状態です`);
                    recommendations.push('広告投資の拡大とSNSマーケティングの強化が必要です');
                } else if (avgNewCount >= 20) {
                    strengths.push(`新規顧客数が月平均${avgNewCount.toFixed(1)}人と好調です`);
                }

                // 入会率分析（正しいフィールド名を使用）
                if (avgEnrollRate < 40) {
                    issues.push(`入会率が${avgEnrollRate.toFixed(1)}%と低い水準です`);
                    recommendations.push('カウンセリング技術の向上とトライアル体験の質を改善してください');
                } else if (avgEnrollRate >= 60) {
                    strengths.push(`入会率${avgEnrollRate.toFixed(1)}%と高い成約率を維持しています`);
                }

                // 退会率分析
                if (avgChurnRate > 15) {
                    issues.push(`退会率が${avgChurnRate.toFixed(1)}%と高い状態です`);
                    recommendations.push('顧客満足度調査とフォローアップ体制の強化を実施してください');
                } else if (avgChurnRate <= 8) {
                    strengths.push(`退会率${avgChurnRate.toFixed(1)}%と優秀な継続率です`);
                }

                // 生産性分析
                if (avgProductivity < 80000) {
                    issues.push(`スタッフ生産性が${Math.round(avgProductivity / 10000)}万円と低い状態です`);
                    recommendations.push('施術効率の改善と高単価メニューの提案力を強化してください');
                } else if (avgProductivity >= 120000) {
                    strengths.push(`スタッフ生産性${Math.round(avgProductivity / 10000)}万円と高効率を実現しています`);
                }

                // 口コミ分析
                const reviewRate = totalNewCount > 0 ? ((totalGReviews + totalHReviews) / totalNewCount) * 100 : 0;
                if (reviewRate < 30) {
                    issues.push(`口コミ獲得率が${reviewRate.toFixed(1)}%と低い状態です`);
                    recommendations.push('施術後の口コミ依頼フローを強化してください');
                }

                // スタッフ間格差分析
                if (staffList.length > 1 && topStaff && lowStaff) {
                    const salesGap = topStaff.sales / lowStaff.sales;
                    if (salesGap > 2.5) {
                        issues.push(`スタッフ間の売上格差が大きい状態です（最大${salesGap.toFixed(1)}倍）`);
                        recommendations.push(`${lowStaff.name}さんへのトレーニング強化と${topStaff.name}さんのノウハウ共有を実施してください`);
                    }
                }

                const summary = `${branch || '全店舗'}の${month || '該当期間'}について分析しました。\n\n` +
                    `【主要指標】\n` +
                    `・個別売上（総売上）: ¥${totalIndividualSales.toLocaleString()}\n` +
                    `・継続売上: ¥${totalRecurringSales.toLocaleString()}\n` +
                    `・合計: ¥${(totalIndividualSales + totalRecurringSales).toLocaleString()}\n` +
                    `・新規顧客数: ${totalNewCount}人（平均${avgNewCount.toFixed(1)}人/月）\n` +
                    `・入会率: ${avgEnrollRate.toFixed(1)}%（${totalNewEnroll}/${totalNewCount}人）\n` +
                    `・退会率: ${avgChurnRate.toFixed(1)}%（${totalChurnCount}人退会）\n` +
                    `・平均生産性: ¥${Math.round(avgProductivity).toLocaleString()}/人\n` +
                    `・口コミ獲得: ${totalGReviews + totalHReviews}件（G:${totalGReviews} / H:${totalHReviews}）\n` +
                    `・紹介数: ${totalReferrals}件\n\n` +
                    (staffList.length > 0 ? `【スタッフパフォーマンス】\n` +
                        `🏆 トップ: ${topStaff.name}（個別売上¥${Math.round(topStaff.sales / 10000)}万円、新規${topStaff.newCount}人）\n` +
                        (staffList.length > 1 ? `📉 要支援: ${lowStaff.name}（個別売上¥${Math.round(lowStaff.sales / 10000)}万円、新規${lowStaff.newCount}人）\n\n` : '\n') : '') +
                    (issues.length > 0 ? `【改善が必要な点】\n${issues.map(i => '⚠️ ' + i).join('\n')}\n\n` : '') +
                    (strengths.length > 0 ? `【強み】\n${strengths.map(s => '✅ ' + s).join('\n')}\n\n` : '') +
