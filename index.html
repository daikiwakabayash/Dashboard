                    (recommendations.length > 0 ? `【推奨アクション】\n${recommendations.map((r, i) => `${i + 1}. ${r}`).join('\n')}` : '');

                return {
                    success: true,
                    message: summary
                };
            };

            // マーケティングデータの分析
            const analyzeMarketingData = (data, branch, month) => {
                if (data.length === 0) {
                    return {
                        success: false,
                        message: `${branch || '指定された条件'}の${month || '期間'}のマーケティングデータが見つかりませんでした。`
                    };
                }

                // 正しいフィールド名で集計
                const totalNewCount = data.reduce((sum, d) => sum + (d.newCount || 0), 0);
                const totalReservations = data.reduce((sum, d) => sum + (d.reservationCount || 0), 0);
                const totalEnrollCount = data.reduce((sum, d) => sum + (d.enrollCount || 0), 0);
                const totalCancelCount = data.reduce((sum, d) => sum + (d.cancelCount || 0), 0);
                const totalAdSpend = data.reduce((sum, d) => sum + (d.adSpend || 0), 0);
                const totalRevenue = data.reduce((sum, d) => sum + (d.revenue || 0), 0);
                const totalClicks = data.reduce((sum, d) => sum + (d.clicks || 0), 0);
                const totalImpressions = data.reduce((sum, d) => sum + (d.impressions || 0), 0);
                const totalCvCount = data.reduce((sum, d) => sum + (d.cvCount || 0), 0);
                const totalReviews = data.reduce((sum, d) => sum + (d.reviewCount || 0), 0);

                // 指標計算
                const avgCPA = totalNewCount > 0 ? Math.round(totalAdSpend / totalNewCount) : 0;
                const enrollRate = totalNewCount > 0 ? Math.round((totalEnrollCount / totalNewCount) * 100) : 0;
                const cancelDenom = totalReservations > 0 ? totalReservations : totalNewCount;
                const cancelRate = cancelDenom > 0 ? Math.round((totalCancelCount / cancelDenom) * 100) : 0;
                const cvr = totalClicks > 0 ? Math.round((totalCvCount / totalClicks) * 1000) / 10 : 0;
                const ctr = totalImpressions > 0 ? Math.round((totalClicks / totalImpressions) * 1000) / 10 : 0;
                const roas = totalAdSpend > 0 ? Math.round((totalRevenue / totalAdSpend) * 100) : 0;
                const avgPrice = totalNewCount > 0 ? Math.round(totalRevenue / totalNewCount) : 0;

                const issues = [];
                const strengths = [];
                const recommendations = [];

                // CPA分析（正確な閾値）
                if (avgCPA > 18000) {
                    issues.push(`CPA（顧客獲得単価）が¥${avgCPA.toLocaleString()}と高い水準です（業界平均: ¥12,000）`);
                    recommendations.push('広告クリエイティブの改善とターゲティングの最適化を実施してください');
                } else if (avgCPA < 8000) {
                    strengths.push(`CPA¥${avgCPA.toLocaleString()}と非常に効率的な顧客獲得ができています`);
                } else if (avgCPA <= 12000) {
                    strengths.push(`CPA¥${avgCPA.toLocaleString()}と業界平均以下で運用できています`);
                }

                // 入会率分析
                if (enrollRate < 35) {
                    issues.push(`入会率が${enrollRate}%と低い水準です（業界平均: 35%）`);
                    recommendations.push('カウンセリング品質の向上と初回体験の改善が必要です');
                } else if (enrollRate >= 60) {
                    strengths.push(`入会率${enrollRate}%と優秀な成約率です`);
                }

                // キャンセル率分析
                if (cancelRate > 15) {
                    issues.push(`キャンセル率が${cancelRate}%と高い状態です（業界平均: 15%）`);
                    recommendations.push('リマインド施策の強化と予約時のコミュニケーション改善が必要です');
                } else if (cancelRate < 10) {
                    strengths.push(`キャンセル率${cancelRate}%と低く抑えられています`);
                }

                // ROAS分析
                if (roas < 200) {
                    issues.push(`ROAS（広告費用対効果）が${roas}%と低い水準です（目標: 300%以上）`);
                    recommendations.push('広告配信の見直しと、入会率向上施策の実施が必要です');
                } else if (roas >= 300) {
                    strengths.push(`ROAS${roas}%と高い広告効果を実現しています`);
                }

                // CVR分析
                if (cvr > 0 && cvr < 1.5) {
                    issues.push(`CVR（コンバージョン率）が${cvr}%と低い状態です`);
                    recommendations.push('ランディングページの改善と訴求内容の見直しを実施してください');
                }

                // 媒体別分析
                const mediaPerformance = {};
                data.forEach(d => {
                    if (!d.media || d.media === '全媒体合計') return;
                    if (!mediaPerformance[d.media]) {
                        mediaPerformance[d.media] = {
                            newCount: 0,
                            enrollCount: 0,
                            adSpend: 0,
                            revenue: 0,
                            records: 0
                        };
                    }
                    mediaPerformance[d.media].newCount += (d.newCount || 0);
                    mediaPerformance[d.media].enrollCount += (d.enrollCount || 0);
                    mediaPerformance[d.media].adSpend += (d.adSpend || 0);
                    mediaPerformance[d.media].revenue += (d.revenue || 0);
                    mediaPerformance[d.media].records++;
                });

                let bestMedia = null;
                let worstMedia = null;
                let bestCPA = Infinity;
                let worstCPA = 0;
                let bestEnrollRate = 0;

                Object.entries(mediaPerformance).forEach(([media, perf]) => {
                    if (perf.newCount > 0) {
                        const mediaCPA = Math.round(perf.adSpend / perf.newCount);
                        const mediaEnrollRate = Math.round((perf.enrollCount / perf.newCount) * 100);

                        if (mediaCPA < bestCPA && mediaCPA > 0) {
                            bestCPA = mediaCPA;
                            bestMedia = media;
                            bestEnrollRate = mediaEnrollRate;
                        }
                        if (mediaCPA > worstCPA) {
                            worstCPA = mediaCPA;
                            worstMedia = media;
                        }
                    }
                });

                if (bestMedia) {
                    recommendations.push(`${bestMedia}が最も効率的（CPA¥${bestCPA.toLocaleString()}、入会率${bestEnrollRate}%）なので、予算配分を増やしてください`);
                }
                if (worstMedia && Object.keys(mediaPerformance).length > 1 && worstCPA > avgCPA * 1.5) {
                    recommendations.push(`${worstMedia}のCPAが¥${worstCPA.toLocaleString()}と高いため、配信内容の見直しまたは停止を検討してください`);
                }

                // 口コミ分析
                if (totalReviews > 0 && totalNewCount > 0) {
                    const reviewRate = Math.round((totalReviews / totalNewCount) * 100);
                    if (reviewRate >= 50) {
                        strengths.push(`口コミ獲得率${reviewRate}%と高い水準です`);
                    }
                }

                const summary = `${branch || '全店舗'}の${month || '該当期間'}のマーケティング分析結果です。\n\n` +
                    `【主要指標】\n` +
                    `・新規来店: ${totalNewCount}人${totalReservations > 0 ? `（予約${totalReservations}件）` : ''}\n` +
                    `・入会数: ${totalEnrollCount}人（入会率${enrollRate}%）\n` +
                    `・キャンセル: ${totalCancelCount}件（キャンセル率${cancelRate}%）\n` +
                    `・広告費: ¥${totalAdSpend.toLocaleString()}\n` +
                    `・売上: ¥${totalRevenue.toLocaleString()}\n` +
                    `・CPA: ¥${avgCPA.toLocaleString()}\n` +
                    `・ROAS: ${roas}%\n` +
                    (totalClicks > 0 ? `・クリック数: ${totalClicks}件（CTR: ${ctr}%、CVR: ${cvr}%）\n` : '') +
                    (totalReviews > 0 ? `・口コミ獲得: ${totalReviews}件\n` : '') +
                    `\n` +
                    (Object.keys(mediaPerformance).length > 0 ? `【媒体別実績】\n${Object.entries(mediaPerformance).sort((a, b) => b[1].newCount - a[1].newCount).map(([media, perf]) => {
                        const mCPA = perf.newCount > 0 ? Math.round(perf.adSpend / perf.newCount) : 0;
                        const mEnrollRate = perf.newCount > 0 ? Math.round((perf.enrollCount / perf.newCount) * 100) : 0;
                        return `${media}: ${perf.newCount}人、CPA¥${mCPA.toLocaleString()}、入会率${mEnrollRate}%`;
                    }).slice(0, 5).join('\n')}\n\n` : '') +
                    (issues.length > 0 ? `【改善が必要な点】\n${issues.map(i => '⚠️ ' + i).join('\n')}\n\n` : '') +
                    (strengths.length > 0 ? `【強み】\n${strengths.map(s => '✅ ' + s).join('\n')}\n\n` : '') +
                    (recommendations.length > 0 ? `【推奨アクション】\n${recommendations.map((r, i) => `${i + 1}. ${r}`).join('\n')}` : '');

                return {
                    success: true,
                    message: summary
                };
            };

            // 質問から対象指標と評価方向を抽出する
            const extractMetricInfo = (question) => {
                const lowerQ = question.toLowerCase();

                // 指標の定義: { key, label, higher_is_better }
                const metrics = [
                    { key: 'cpa', label: 'CPA（顧客獲得単価）', keywords: ['cpa', '顧客獲得単価', '獲得単価'], higher_is_better: false },
                    { key: 'roas', label: 'ROAS（広告費用対効果）', keywords: ['roas', '広告費用対効果'], higher_is_better: true },
                    { key: 'cvr', label: 'CVR（コンバージョン率）', keywords: ['cvr', 'コンバージョン'], higher_is_better: true },
                    { key: 'ctr', label: 'CTR（クリック率）', keywords: ['ctr', 'クリック率'], higher_is_better: true },
                    { key: 'enrollRate', label: '入会率', keywords: ['入会率'], higher_is_better: true },
                    { key: 'churnRate', label: '退会率', keywords: ['退会率', '離反率'], higher_is_better: false },
                    { key: 'cancelRate', label: 'キャンセル率', keywords: ['キャンセル率'], higher_is_better: false },
                    { key: 'sales', label: '売上', keywords: ['売上'], higher_is_better: true },
                    { key: 'newCount', label: '新規数', keywords: ['新規'], higher_is_better: true },
                    { key: 'productivity', label: '生産性', keywords: ['生産性'], higher_is_better: true },
                    { key: 'adSpend', label: '広告費', keywords: ['広告費'], higher_is_better: false },
                    { key: 'reviews', label: '口コミ数', keywords: ['口コミ', 'レビュー'], higher_is_better: true },
                ];

                let targetMetric = null;
                for (const m of metrics) {
                    if (m.keywords.some(kw => lowerQ.includes(kw))) {
                        targetMetric = m;
                        break;
                    }
                }

                // 評価方向の判定（「悪い」「高い」「低い」「良い」）
                let wantBad = true; // デフォルトは「悪い方を知りたい」
                if (lowerQ.includes('良い') || lowerQ.includes('いい') || lowerQ.includes('ベスト') || lowerQ.includes('最高') || lowerQ.includes('一番良い')) {
                    wantBad = false;
                } else if (lowerQ.includes('悪い') || lowerQ.includes('ワースト') || lowerQ.includes('最悪') || lowerQ.includes('一番悪い')) {
                    wantBad = true;
                } else if (lowerQ.includes('高い') || lowerQ.includes('一番高い')) {
                    // 「高い」は指標によって良い/悪いが変わる
                    wantBad = targetMetric ? !targetMetric.higher_is_better : false;
                } else if (lowerQ.includes('低い') || lowerQ.includes('一番低い')) {
                    // 「低い」は指標によって良い/悪いが変わる
                    wantBad = targetMetric ? targetMetric.higher_is_better : true;
                }

                return { metric: targetMetric, wantBad };
            };

            // マーケティングデータの指標別店舗ランキング
            const generateMetricRankingResponse = (data, question, month) => {
                const { metric, wantBad } = extractMetricInfo(question);

                if (!metric) {
                    return {
                        success: false,
                        message: '指標を特定できませんでした。具体的な指標名（CPA、入会率、売上など）を含めて質問してください。'
                    };
                }

                // 店舗ごとにデータを集計
                const branchMap = {};
                data.forEach(d => {
                    const branch = d.branch;
                    if (!branch) return;
                    if (!branchMap[branch]) {
                        branchMap[branch] = {
                            branch,
                            newCount: 0, enrollCount: 0, cancelCount: 0,
                            adSpend: 0, revenue: 0, reservationCount: 0,
                            clicks: 0, impressions: 0, cvCount: 0,
                            reviewCount: 0, records: 0,
                            // 経営データ用
                            individualSales: 0, recurringSales: 0,
                            newEnroll: 0, churnCount: 0, prevMembers: 0,
                            productivity: 0, gReviews: 0, hReviews: 0,
                        };
                    }
                    const b = branchMap[branch];
                    b.newCount += (d.newCount || 0);
                    b.enrollCount += (d.enrollCount || 0);
                    b.cancelCount += (d.cancelCount || 0);
                    b.adSpend += (d.adSpend || 0);
                    b.revenue += (d.revenue || 0);
                    b.reservationCount += (d.reservationCount || 0);
                    b.clicks += (d.clicks || 0);
                    b.impressions += (d.impressions || 0);
                    b.cvCount += (d.cvCount || 0);
                    b.reviewCount += (d.reviewCount || 0);
                    b.records++;
                    // 経営データ用
                    b.individualSales += (d.individualSales || 0);
                    b.recurringSales += (d.recurringSales || 0);
                    b.newEnroll += (d.newEnroll || 0);
                    b.churnCount += (d.churnCount || 0);
                    b.prevMembers += (d.prevMembers || 0);
                    b.productivity += (d.productivity || 0);
                    b.gReviews += (d.gReviews || 0);
                    b.hReviews += (d.hReviews || 0);
                });

                // 各店舗の指標値を計算
                const branchMetrics = Object.values(branchMap).map(b => {
                    let value = 0;
                    let displayValue = '';

                    switch (metric.key) {
                        case 'cpa':
                            value = b.newCount > 0 ? Math.round(b.adSpend / b.newCount) : 0;
                            displayValue = `¥${value.toLocaleString()}`;
                            break;
                        case 'roas':
                            value = b.adSpend > 0 ? Math.round((b.revenue / b.adSpend) * 100) : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'cvr':
                            value = b.clicks > 0 ? Math.round((b.cvCount / b.clicks) * 1000) / 10 : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'ctr':
                            value = b.impressions > 0 ? Math.round((b.clicks / b.impressions) * 1000) / 10 : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'enrollRate':
                            const nc = b.newCount || b.newEnroll + b.churnCount;
                            const ec = b.enrollCount || b.newEnroll;
                            value = nc > 0 ? Math.round((ec / nc) * 100) : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'churnRate':
                            value = b.prevMembers > 0 ? Math.round((b.churnCount / b.prevMembers) * 1000) / 10 : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'cancelRate':
                            const denom = b.reservationCount > 0 ? b.reservationCount : b.newCount;
                            value = denom > 0 ? Math.round((b.cancelCount / denom) * 100) : 0;
                            displayValue = `${value}%`;
                            break;
                        case 'sales':
                            value = b.individualSales || b.revenue || 0;
                            displayValue = `¥${value.toLocaleString()}`;
                            break;
                        case 'newCount':
                            value = b.newCount;
                            displayValue = `${value}人`;
                            break;
                        case 'productivity':
                            value = b.records > 0 ? Math.round(b.productivity / b.records) : 0;
                            displayValue = `¥${value.toLocaleString()}`;
                            break;
                        case 'adSpend':
                            value = b.adSpend;
                            displayValue = `¥${value.toLocaleString()}`;
                            break;
                        case 'reviews':
                            value = b.reviewCount || (b.gReviews + b.hReviews) || 0;
                            displayValue = `${value}件`;
                            break;
                        default:
                            value = 0;
                            displayValue = '-';
                    }

                    return { branch: b.branch, value, displayValue };
                }).filter(b => b.value > 0);

                if (branchMetrics.length === 0) {
                    return {
                        success: false,
                        message: `${metric.label}のデータが見つかりませんでした。`
                    };
                }

                // ソート: wantBad の場合、悪い順（higher_is_better なら昇順、そうでなければ降順）
                const sortAsc = wantBad ? metric.higher_is_better : !metric.higher_is_better;
                branchMetrics.sort((a, b) => sortAsc ? a.value - b.value : b.value - a.value);

                const evalWord = wantBad ? '悪い' : '良い';
                const evalEmoji = wantBad ? '⚠️' : '✅';

                // 閾値判定
                const thresholds = {
                    cpa: { bad: 18000, good: 12000, unit: '¥' },
                    roas: { bad: 200, good: 300, unit: '%' },
                    cvr: { bad: 1.5, good: 3, unit: '%' },
                    enrollRate: { bad: 35, good: 60, unit: '%' },
                    churnRate: { bad: 15, good: 8, unit: '%' },
                    cancelRate: { bad: 15, good: 10, unit: '%' },
                };

                let response = `${month || '該当期間'}の${metric.label}が${evalWord}い店舗ランキング:\n\n`;

                branchMetrics.forEach((b, i) => {
                    const rank = i + 1;
                    let icon = '';
                    const th = thresholds[metric.key];
                    if (th) {
                        const isBad = metric.higher_is_better ? b.value < th.bad : b.value > th.bad;
                        const isGood = metric.higher_is_better ? b.value >= th.good : b.value <= th.good;
                        icon = isBad ? ' ⚠️' : isGood ? ' ✅' : '';
                    }
                    response += `${rank}. ${b.branch}: ${metric.label} ${b.displayValue}${icon}\n`;
                });

                // 悪い店舗への具体的アドバイス
                const worstBranches = branchMetrics.slice(0, 3);
                const th = thresholds[metric.key];
                const needsAttention = th ? worstBranches.filter(b => {
                    return metric.higher_is_better ? b.value < th.bad : b.value > th.bad;
                }) : worstBranches;

                if (wantBad && needsAttention.length > 0) {
                    response += `\n【要改善店舗】\n`;
                    needsAttention.forEach(b => {
                        response += `⚠️ ${b.branch}（${metric.label}: ${b.displayValue}）\n`;
                    });

                    // 指標別のアドバイス
                    const adviceMap = {
                        cpa: '→ 広告クリエイティブの改善、ターゲティングの見直し、効率の良い媒体への予算シフトを検討してください',
                        roas: '→ 広告配信の最適化と入会率向上施策の実施が必要です',
                        cvr: '→ ランディングページの改善と訴求内容の見直しを実施してください',
                        enrollRate: '→ カウンセリング品質の向上と初回体験の改善が必要です',
                        churnRate: '→ 顧客満足度調査とフォローアップ体制の強化を実施してください',
                        cancelRate: '→ リマインド施策の強化と予約時のコミュニケーション改善が必要です',
                    };
                    if (adviceMap[metric.key]) {
                        response += `\n${adviceMap[metric.key]}`;
                    }
                } else if (!wantBad) {
                    const bestBranches = branchMetrics.slice(0, 3);
                    response += `\n【優秀な店舗】\n`;
                    bestBranches.forEach(b => {
                        response += `✅ ${b.branch}（${metric.label}: ${b.displayValue}）\n`;
                    });
                    response += `\n→ これらの店舗の運用ノウハウを他店舗に展開することを推奨します`;
                }

                return {
                    success: true,
                    message: response.trim()
                };
            };

            // 質問タイプ別の回答生成関数
            const generateStaffListResponse = (data, branch, month) => {
                const staffMap = {};
                data.forEach(d => {
                    const key = d.name || '不明';
                    if (!staffMap[key]) {
                        staffMap[key] = {
                            name: key,
                            branch: d.branch
                        };
                    }
                });

                const staffList = Object.values(staffMap);

                if (staffList.length === 0) {
                    return {
                        success: false,
                        message: `${branch || '該当条件'}のスタッフ情報が見つかりませんでした。`
                    };
                }

                // シンプルにスタッフ名のみを返す
                let response = `${branch || '該当店舗'}のスタッフ:\n\n`;
                staffList.forEach((staff, index) => {
                    response += `${index + 1}. ${staff.name}\n`;
                });

                return {
                    success: true,
                    message: response.trim()
                };
            };

            const generateSalesQueryResponse = (data, branch, month) => {
                const totalSales = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.individualSales), 0));
                const totalRecurring = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.recurringSales), 0));

                const response = `${branch || '該当条件'}の${month || '期間'}の売上は:\n\n` +
                    `💰 個別売上: ¥${totalSales.toLocaleString()}\n` +
                    `🔄 継続売上: ¥${totalRecurring.toLocaleString()}\n` +
                    `📊 合計: ¥${(totalSales + totalRecurring).toLocaleString()}`;

                return {
                    success: true,
                    message: response
                };
            };

            const generatePerformanceSummaryResponse = (data, branch, month) => {
                const totalSales = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.individualSales), 0));
                const totalNewCount = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.newCount), 0));
                const totalNewEnroll = validateNumber(data.reduce((sum, d) => sum + validateNumber(d.newEnroll), 0));
                const enrollRate = totalNewCount > 0 ? Math.round((totalNewEnroll / totalNewCount) * 100) : 0;

                let grade = '⭐⭐⭐⭐⭐';
                if (enrollRate < 30) grade = '⭐⭐';
                else if (enrollRate < 40) grade = '⭐⭐⭐';
                else if (enrollRate < 50) grade = '⭐⭐⭐⭐';

                const response = `${branch || '該当条件'}の${month || '期間'}のマークは:\n\n` +
                    `${grade}\n\n` +
                    `💰 売上: ¥${Math.round(totalSales / 10000)}万円\n` +
                    `👥 新規: ${totalNewCount}人\n` +
                    `✅ 入会率: ${enrollRate}%\n\n` +
                    (enrollRate >= 50 ? '🎉 優秀な成績です！' :
                     enrollRate >= 40 ? '👍 良好な成績です。' :
                     enrollRate >= 30 ? '📈 もう少し頑張りましょう。' :
                     '⚠️ 改善が必要です。');

                return {
                    success: true,
                    message: response
                };
            };

            // ── データコンテキスト構築（Claude API 用）──
            const buildDataContext = (question) => {
                const sections = [];
                const lowerQ = question.toLowerCase();

                // ── ブランチ検出 ──
                let targetBranch = null;
                for (const branch of allBranches) {
                    if (lowerQ.includes(branch.toLowerCase())) { targetBranch = branch; break; }
                }
                if (!targetBranch) {
                    for (const branch of allBranches) {
                        const base = branch.replace(/駅?院$/, '');
                        if (base.length >= 2 && lowerQ.includes(base.toLowerCase())) { targetBranch = branch; break; }
                    }
                }
                if (!targetBranch) {
                    for (const branch of allBranches) {
                        if (branch.length >= 2 && lowerQ.includes(branch.substring(0, 2).toLowerCase())) { targetBranch = branch; break; }
                    }
                }
                if (/全店舗|全体|全院/.test(question)) targetBranch = null;

                // ── 月検出 ──
                let targetMonth = null;
                let mm = lowerQ.match(/(\d{2,4})年(\d{1,2})月/);
                if (mm) {
                    let y = mm[1]; if (y.length === 2) y = '20' + y;
                    targetMonth = y + '年' + parseInt(mm[2]) + '月';
                }
                if (!targetMonth) {
                    mm = lowerQ.match(/(\d{1,2})月/);
                    if (mm) {
                        const yCounts = {};
                        rawData.forEach(d => { const ym = (d.month || '').match(/(\d{4})年/); if (ym) yCounts[ym[1]] = (yCounts[ym[1]] || 0) + 1; });
                        const topY = Object.keys(yCounts).sort((a, b) => yCounts[b] - yCounts[a])[0] || String(new Date().getFullYear());
                        targetMonth = topY + '年' + parseInt(mm[1]) + '月';
                    }
                }

                const vn = (n) => (n == null || isNaN(n) || !isFinite(n)) ? 0 : Math.round(n);

                // ── ベンチマーク評価ヘルパー ──
                const gradeEnrollRate = (r) => r >= 55 ? '優秀' : r >= 40 ? '良好' : r >= 30 ? '平均' : '要改善';
                const gradeChurnRate = (r) => r <= 5 ? '優秀' : r <= 10 ? '良好' : r <= 15 ? '平均' : '要改善';
                const gradeCPA = (v) => v <= 8000 ? '優秀' : v <= 12000 ? '良好' : v <= 18000 ? '平均' : '要改善';
                const gradeProductivity = (v) => v >= 1200000 ? '優秀' : v >= 800000 ? '良好' : v >= 600000 ? '平均' : '要改善';
                const delta = (cur, prev) => prev > 0 ? ((cur - prev) / prev * 100).toFixed(1) : '-';

                // ── 前月キーを算出 ──
                const getPrevMonth = (monthStr) => {
                    const ym = (monthStr || '').match(/(\d{4})年(\d{1,2})月/);
                    if (!ym) return null;
                    let y = parseInt(ym[1]), m = parseInt(ym[2]) - 1;
                    if (m === 0) { m = 12; y--; }
                    return y + '年' + m + '月';
                };

                // ── 店舗別月次集計ヘルパー ──
                const aggregateBranch = (data, branch, month) => {
                    const bd = data.filter(d => d.branch === branch && d.month === month);
                    if (bd.length === 0) return null;
                    const sales = bd.reduce((s, d) => s + vn(d.individualSales), 0);
                    const recurring = bd.reduce((s, d) => s + vn(d.recurringSales), 0);
                    const nc = bd.reduce((s, d) => s + vn(d.newCount), 0);
                    const ne = bd.reduce((s, d) => s + vn(d.newEnroll), 0);
                    const ch = bd.reduce((s, d) => s + vn(d.churnCount), 0);
                    const pm = bd.reduce((s, d) => s + vn(d.prevMembers), 0);
                    const prod = bd.reduce((s, d) => s + vn(d.productivity), 0);
                    const gr = bd.reduce((s, d) => s + vn(d.gReviews), 0);
                    const hr = bd.reduce((s, d) => s + vn(d.hReviews), 0);
                    const ref = bd.reduce((s, d) => s + vn(d.referrals), 0);
                    const er = nc > 0 ? Math.round((ne / nc) * 100) : 0;
                    const cr = pm > 0 ? Math.round((ch / pm) * 1000) / 10 : 0;
                    const avgProd = bd.length > 0 ? Math.round(prod / bd.length) : 0;
                    return { sales, recurring, nc, ne, ch, pm, er, cr, avgProd, gr, hr, ref, staffCount: bd.length };
                };

                // ── 経営データ ──
                if (rawData.length > 0) {
                    sections.push('■ 経営データ');

                    // 1) スタッフ別詳細データ（対象ブランチ＋月、最大30件）
                    if (targetBranch || targetMonth) {
                        const focused = rawData.filter(d => {
                            const bOk = !targetBranch || d.branch === targetBranch;
                            const mOk = !targetMonth || d.month === targetMonth;
                            return bOk && mOk;
                        });
                        if (focused.length > 0) {
                            const label = [targetBranch, targetMonth].filter(Boolean).join(' / ');
                            sections.push('\n▼ ' + label + '（スタッフ別詳細）');
                            focused.slice(0, 30).forEach(d => {
                                const er = d.newCount > 0 ? Math.round((d.newEnroll / d.newCount) * 100) : 0;
                                sections.push(
                                    (d.name || '不明') + '(' + d.branch + '/' + d.month + '): ' +
                                    '個別売上¥' + vn(d.individualSales).toLocaleString() +
                                    ', 継続¥' + vn(d.recurringSales).toLocaleString() +
                                    ', 新規' + vn(d.newCount) + ', 入会' + vn(d.newEnroll) + '(' + er + '%)' +
                                    ', 退会' + vn(d.churnCount) + ', 前月会員' + vn(d.prevMembers) +
                                    ', 生産性¥' + vn(d.productivity).toLocaleString() +
                                    ', G口コミ' + vn(d.gReviews) + ', H口コミ' + vn(d.hReviews) +
                                    ', 紹介' + vn(d.referrals)
                                );
                            });
                        }
                    }

                    // 2) 月次推移（前月比デルタ付き、直近6ヶ月）
                    if (targetBranch) {
                        const bd = rawData.filter(d => d.branch === targetBranch);
                        const months = [...new Set(bd.map(d => d.month))].sort().slice(-6);
                        if (months.length > 1) {
                            sections.push('\n▼ ' + targetBranch + ' 月次推移（前月比付き）');
                            let prevAgg = null;
                            months.forEach(mo => {
                                const agg = aggregateBranch(rawData, targetBranch, mo);
                                if (!agg) return;
                                let line = mo + ': 売上¥' + agg.sales.toLocaleString();
                                if (prevAgg) line += '(前月比' + delta(agg.sales, prevAgg.sales) + '%)';
                                line += ', 新規' + agg.nc;
                                if (prevAgg) line += '(前月比' + delta(agg.nc, prevAgg.nc) + '%)';
                                line += ', 入会率' + agg.er + '%[' + gradeEnrollRate(agg.er) + ']';
                                line += ', 退会率' + agg.cr + '%[' + gradeChurnRate(agg.cr) + ']';
                                line += ', 生産性¥' + agg.avgProd.toLocaleString();
                                sections.push(line);
                                prevAgg = agg;
                            });
                        }
                    }

                    // 3) 店舗ランキング（対象月 or 最新月 — 売上順・ベンチマーク評価付き）
                    const compareMonth = targetMonth || [...new Set(rawData.map(d => d.month))].sort().pop();
                    const prevMonth = getPrevMonth(compareMonth);
                    if (compareMonth) {
                        const branches = [...new Set(rawData.filter(d => d.month === compareMonth).map(d => d.branch))];
                        if (branches.length > 1) {
                            const ranked = branches.map(b => {
                                const cur = aggregateBranch(rawData, b, compareMonth);
                                const prev = prevMonth ? aggregateBranch(rawData, b, prevMonth) : null;
                                return { branch: b, cur, prev };
                            }).filter(r => r.cur).sort((a, b) => b.cur.sales - a.cur.sales);

                            sections.push('\n▼ ' + compareMonth + ' 店舗ランキング（売上順・ベンチマーク評価付き）');
                            ranked.forEach((r, i) => {
                                const c = r.cur;
                                const p = r.prev;
                                let line = (i + 1) + '. ' + r.branch;
                                line += ': 売上¥' + c.sales.toLocaleString();
                                if (p) line += '(前月比' + delta(c.sales, p.sales) + '%)';
                                line += ', 新規' + c.nc;
                                if (p) line += '(前月比' + delta(c.nc, p.nc) + '%)';
                                line += ', 入会率' + c.er + '%[' + gradeEnrollRate(c.er) + ']';
                                line += ', 退会率' + c.cr + '%[' + gradeChurnRate(c.cr) + ']';
                                line += ', 生産性¥' + c.avgProd.toLocaleString() + '[' + gradeProductivity(c.avgProd) + ']';
                                line += ', スタッフ' + c.staffCount + '人';
                                sections.push(line);
                            });

                            // 全店舗合計サマリー
                            const totSales = ranked.reduce((s, r) => s + r.cur.sales, 0);
                            const totNc = ranked.reduce((s, r) => s + r.cur.nc, 0);
                            const totNe = ranked.reduce((s, r) => s + r.cur.ne, 0);
                            const totCh = ranked.reduce((s, r) => s + r.cur.ch, 0);
                            const totPm = ranked.reduce((s, r) => s + r.cur.pm, 0);
                            sections.push('合計: 売上¥' + totSales.toLocaleString() + ', 新規' + totNc + ', 入会率' + (totNc > 0 ? Math.round((totNe / totNc) * 100) : 0) + '%, 退会率' + (totPm > 0 ? Math.round((totCh / totPm) * 1000) / 10 : 0) + '%');
                        }
                    }
                }

                // ── マーケティングデータ ──
                if (mktData.length > 0) {
                    sections.push('\n■ マーケティングデータ');
                    let mf = mktData;
                    if (targetBranch) mf = mf.filter(d => d.branch === targetBranch || (d.branch && d.branch.includes(targetBranch.replace(/駅?院$/, ''))));
                    if (targetMonth) mf = mf.filter(d => d.month === targetMonth);
                    if (mf.length === 0) {
                        const latestM = [...new Set(mktData.map(d => d.month).filter(Boolean))].sort().pop();
                        mf = mktData.filter(d => d.month === latestM);
                    }

                    // 前月マーケティングデータ（比較用）
                    const mktMonth = targetMonth || [...new Set(mf.map(d => d.month).filter(Boolean))].sort().pop();
                    const mktPrevMonth = getPrevMonth(mktMonth);
                    let mfPrev = [];
                    if (mktPrevMonth) {
                        mfPrev = mktData.filter(d => d.month === mktPrevMonth);
                        if (targetBranch) mfPrev = mfPrev.filter(d => d.branch === targetBranch || (d.branch && d.branch.includes(targetBranch.replace(/駅?院$/, ''))));
                    }
                    const prevByB = {};
                    mfPrev.forEach(d => {
                        const b = d.branch || '不明';
                        if (!prevByB[b]) prevByB[b] = { nc: 0, ec: 0, cc: 0, as: 0, rv: 0 };
                        prevByB[b].nc += d.newCount || 0;
                        prevByB[b].ec += d.enrollCount || 0;
                        prevByB[b].cc += d.cancelCount || 0;
                        prevByB[b].as += d.adSpend || 0;
                        prevByB[b].rv += d.revenue || 0;
                    });

                    const byB = {};
                    mf.forEach(d => {
                        const b = d.branch || '不明';
                        if (!byB[b]) byB[b] = { nc: 0, ec: 0, cc: 0, as: 0, rv: 0, media: {} };
                        byB[b].nc += d.newCount || 0;
                        byB[b].ec += d.enrollCount || 0;
                        byB[b].cc += d.cancelCount || 0;
                        byB[b].as += d.adSpend || 0;
                        byB[b].rv += d.revenue || 0;
                        if (d.media && d.media !== '全媒体合計') {
                            if (!byB[b].media[d.media]) byB[b].media[d.media] = { nc: 0, as: 0, ec: 0 };
                            byB[b].media[d.media].nc += d.newCount || 0;
                            byB[b].media[d.media].as += d.adSpend || 0;
                            byB[b].media[d.media].ec += d.enrollCount || 0;
                        }
                    });
                    Object.entries(byB).slice(0, 15).forEach(([b, d]) => {
                        const cpa = d.nc > 0 ? Math.round(d.as / d.nc) : 0;
                        const er = d.nc > 0 ? Math.round((d.ec / d.nc) * 100) : 0;
                        const roas = d.as > 0 ? Math.round((d.rv / d.as) * 100) : 0;
                        const p = prevByB[b];
                        let line = b + ': 新規' + d.nc;
                        if (p) line += '(前月比' + delta(d.nc, p.nc) + '%)';
                        line += ', 入会率' + er + '%[' + gradeEnrollRate(er) + ']';
                        line += ', CPA¥' + cpa.toLocaleString() + '[' + gradeCPA(cpa) + ']';
                        if (p && p.nc > 0) line += '(前月CPA¥' + Math.round(p.as / p.nc).toLocaleString() + ')';
                        line += ', ROAS' + roas + '%';
                        line += ', 広告費¥' + d.as.toLocaleString();
                        sections.push(line);
                        Object.entries(d.media).sort((a, b) => b[1].nc - a[1].nc).slice(0, 5).forEach(([m, md]) => {
                            const mCpa = md.nc > 0 ? Math.round(md.as / md.nc) : 0;
                            const mEr = md.nc > 0 ? Math.round((md.ec / md.nc) * 100) : 0;
                            sections.push('  └ ' + m + ': ' + md.nc + '人, CPA¥' + mCpa.toLocaleString() + ', 入会率' + mEr + '%');
                        });
                    });
                }

                // ── サブスクリプションデータ ──
                if (sqData && sqData.subscriptions) {
                    sections.push('\n■ サブスクリプションデータ');
                    const subs = sqData.subscriptions || [];
                    const stores = sqData.stores || [];
                    const invs = sqData.invoices || [];
                    let totalMRR = 0;
                    let totalActive = 0;
                    let totalCanceled = 0;
                    stores.forEach(store => {
                        if (targetBranch && !store.name.includes(targetBranch.replace(/駅?院$/, ''))) return;
                        const storeLids = store.locationIds || [];
                        const ss = subs.filter(s => storeLids.includes(s.locationId));
                        const active = ss.filter(s => s.status === 'ACTIVE').length;
                        const canceled = ss.filter(s => s.status === 'CANCELED' || s.status === 'DEACTIVATED').length;
                        const paused = ss.filter(s => s.status === 'PAUSED').length;
                        const mrr = ss.filter(s => s.status === 'ACTIVE').reduce((sum, s) => sum + (s.monthlyPrice || 0), 0);
                        totalMRR += mrr; totalActive += active; totalCanceled += canceled;
                        const now = new Date();
                        const recent3m = ss.filter(s => (s.status === 'CANCELED' || s.status === 'DEACTIVATED') && s.canceledDate).filter(s => {
                            const cd = new Date(s.canceledDate);
                            const diff = (now - cd) / (1000 * 60 * 60 * 24);
                            return diff <= 90;
                        }).length;
                        let line = store.name + ': アクティブ' + active + ', 解約累計' + canceled + '(直近3ヶ月' + recent3m + '), 休止' + paused + ', MRR¥' + mrr.toLocaleString();
                        if (active + canceled > 0) {
                            line += ', 解約率' + Math.round((canceled / (active + canceled)) * 100) + '%';
                        }
                        sections.push(line);
                    });
                    if (!targetBranch && stores.length > 1) {
                        sections.push('全店合計: アクティブ' + totalActive + ', MRR¥' + totalMRR.toLocaleString() + ', ARR¥' + (totalMRR * 12).toLocaleString());
                    }

                    // ── 会員詳細データ（解約者・新規入会者・アクティブ会員の個別一覧） ──
                    if (sqCustomerData && (targetBranch || /解約|退会|新規|入会|アクティブ|一覧|リスト|名前|氏名|患者|会員|誰/.test(question))) {
                        const memberLine = (m) => {
                            const lastPaid = m.paidMonths && m.paidMonths.length > 0 ? [...m.paidMonths].sort().reverse()[0] : '-';
                            return m.name + ': コース=' + (m.plan || '-') + ', 入会日=' + (m.startDate || '-') + ', 決済回数=' + (m.paidCount || 0) + '回, 合計金額=¥' + (m.paidTotal || 0).toLocaleString() + ', 最終決済月=' + lastPaid;
                        };

                        // 解約者一覧
                        if (/解約|退会|チャーン|churn|離脱/.test(lowerQ) || !targetBranch) {
                            const list = sqCustomerData.canceledList || [];
                            if (list.length > 0) {
                                sections.push('\n▼ ' + (sqStore === 'all' ? '全店' : '') + sqMonth + ' 解約者一覧（' + list.length + '名）');
                                list.slice(0, 50).forEach(m => {
                                    sections.push(memberLine(m) + ', 解約日=' + (m.canceledDate || '-'));
                                });
                            }
                        }

                        // 新規入会者一覧
                        if (/新規|入会|新入|new/.test(lowerQ) || !targetBranch) {
                            const list = sqCustomerData.newMonthList || [];
                            if (list.length > 0) {
                                sections.push('\n▼ ' + (sqStore === 'all' ? '全店' : '') + sqMonth + ' 新規入会者一覧（' + list.length + '名）');
                                list.slice(0, 50).forEach(m => {
                                    sections.push(memberLine(m));
                                });
                            }
                        }

                        // アクティブ会員一覧（店舗指定時のみ）
                        if (/アクティブ|会員|一覧|リスト|全員/.test(lowerQ) && targetBranch) {
                            const list = sqCustomerData.activeList || [];
                            if (list.length > 0) {
                                sections.push('\n▼ ' + sqMonth + ' アクティブ会員一覧（' + list.length + '名）');
                                list.slice(0, 80).forEach(m => {
                                    sections.push(memberLine(m));
                                });
                            }
                        }

                        // 一時停止者一覧
                        if (/停止|休止|pause/.test(lowerQ)) {
                            const list = sqCustomerData.pausedList || [];
                            if (list.length > 0) {
                                sections.push('\n▼ ' + sqMonth + ' 一時停止者一覧（' + list.length + '名）');
                                list.slice(0, 50).forEach(m => {
                                    sections.push(memberLine(m) + ', 停止日=' + (m.canceledDate || '-'));
                                });
                            }
                        }

                        // 復帰者一覧
                        if (/復帰|再開|resume/.test(lowerQ)) {
                            const list = sqCustomerData.resumedList || [];
                            if (list.length > 0) {
                                sections.push('\n▼ ' + sqMonth + ' 復帰者一覧（' + list.length + '名）');
                                list.slice(0, 50).forEach(m => {
                                    sections.push(memberLine(m) + ', 復帰月=' + (m.resumedDate || '-'));
                                });
                            }
                        }
                    }
                }

                // ── 利用可能な店舗・期間 ──
                sections.push('\n■ 利用可能な店舗: ' + allBranches.join('、'));
                const allMonths = [...new Set(rawData.map(d => d.month).filter(Boolean))].sort();
                if (allMonths.length > 0) {
                    sections.push('■ 利用可能な期間: ' + allMonths[0] + ' 〜 ' + allMonths[allMonths.length - 1]);
                }

                return sections.join('\n');
            };

            // チャットメッセージ送信（Claude AI API）
            const handleChatSubmit = async () => {
                if (!chatInput.trim() || chatLoading) return;

                const userMessage = chatInput.trim();
                setChatMessages(prev => [...prev, { type: 'user', content: userMessage }]);
                setChatInput('');
                setChatLoading(true);

                try {
                    const dataContext = buildDataContext(userMessage);
                    const history = chatMessages.map(msg => ({
                        role: msg.type === 'user' ? 'user' : 'assistant',
                        content: msg.content
                    }));

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: userMessage,
                            history: history.slice(-20),
                            dataContext,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.message || 'APIエラー: ' + response.status);
                    }

                    // SSE ストリーミング処理
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantText = '';
                    let buffer = '';

                    // 空のアシスタントメッセージを追加（ストリーミング表示先）
                    setChatMessages(prev => [...prev, { type: 'assistant', content: '' }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            try {
                                const evt = JSON.parse(line.slice(6));
                                if (evt.type === 'text') {
                                    assistantText += evt.text;
                                    const currentText = assistantText;
                                    setChatMessages(prev => {
                                        const updated = [...prev];
                                        updated[updated.length - 1] = { type: 'assistant', content: currentText };
                                        return updated;
                                    });
                                } else if (evt.type === 'error') {
                                    throw new Error(evt.error);
                                }
                            } catch (e) {
                                if (e.message && !e.message.includes('JSON')) throw e;
                            }
                        }
                    }

                    if (!assistantText) throw new Error('応答が空でした');

                } catch (err) {
                    console.error('Chat API error:', err);
                    setChatMessages(prev => {
                        const last = prev[prev.length - 1];
                        const errorMsg = 'すみません、エラーが発生しました: ' + err.message +
                            '\n\nAI機能を使用するには、Vercelの環境変数にANTHROPIC_API_KEYを設定してください。';
                        if (last && last.type === 'assistant' && !last.content) {
                            const updated = [...prev];
                            updated[updated.length - 1] = { type: 'assistant', content: errorMsg };
                            return updated;
                        }
                        return [...prev, { type: 'assistant', content: errorMsg }];
                    });
                }

                setChatLoading(false);
                setTimeout(() => {
                    if (chatContainerRef.current) {
                        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
                    }
                }, 100);
            };

            // ── 事業計画: 店舗別実績データ計算 ──
            const computePlanActuals = (branchName) => {
                const vn = (n) => (n == null || isNaN(n) || !isFinite(n)) ? 0 : Math.round(n);
                const allMonths = [...new Set(rawData.map(d => d.month).filter(Boolean))].sort();
                const latestMonth = allMonths[allMonths.length - 1] || '';
                const prevMonth = allMonths[allMonths.length - 2] || '';
                const branchFilter = branchName ? (d => d.branch === branchName) : (() => true);
                const curData = rawData.filter(d => d.month === latestMonth).filter(branchFilter);
                const prevData = rawData.filter(d => d.month === prevMonth).filter(branchFilter);
                const totalSales = curData.reduce((s, d) => s + vn(d.individualSales), 0);
                const totalNewCount = curData.reduce((s, d) => s + vn(d.newCount), 0);
                const totalNewEnroll = curData.reduce((s, d) => s + vn(d.newEnroll), 0);
                const enrollRate = totalNewCount > 0 ? Math.round((totalNewEnroll / totalNewCount) * 100) : 0;
                const churnCount = curData.reduce((s, d) => s + vn(d.churnCount), 0);
                const prevMembers = curData.reduce((s, d) => s + vn(d.prevMembers), 0);
                const churnRate = prevMembers > 0 ? Math.round((churnCount / prevMembers) * 100) : 0;
                const prevSales = prevData.reduce((s, d) => s + vn(d.individualSales), 0);
                const prevNewCount = prevData.reduce((s, d) => s + vn(d.newCount), 0);
                // マーケティング: 媒体別CPA
                const mktFilter = branchName ? (d => d.branch === branchName) : (() => true);
                const curMkt = mktData.filter(d => d.month === latestMonth && d.media !== '全媒体合計').filter(mktFilter);
                const prevMkt = mktData.filter(d => d.month === prevMonth && d.media !== '全媒体合計').filter(mktFilter);
                const totalAdSpend = curMkt.reduce((s, d) => s + (d.adSpend || 0), 0);
                const mktNewCount = curMkt.reduce((s, d) => s + (d.newCount || 0), 0);
                const cpa = mktNewCount > 0 ? Math.round(totalAdSpend / mktNewCount) : 0;
                // 媒体別内訳
                const mediaMap = {};
                curMkt.forEach(d => {
                    if (!d.media) return;
                    if (!mediaMap[d.media]) mediaMap[d.media] = { adSpend: 0, newCount: 0, enrollCount: 0, revenue: 0 };
                    mediaMap[d.media].adSpend += d.adSpend || 0;
                    mediaMap[d.media].newCount += d.newCount || 0;
                    mediaMap[d.media].enrollCount += d.enrollCount || 0;
                    mediaMap[d.media].revenue += d.revenue || 0;
                });
                const mediaBreakdown = Object.entries(mediaMap).map(([media, v]) => ({
                    media, adSpend: v.adSpend, newCount: v.newCount, enrollCount: v.enrollCount, revenue: v.revenue,
                    cpa: v.newCount > 0 ? Math.round(v.adSpend / v.newCount) : 0,
                    enrollRate: v.newCount > 0 ? Math.round((v.enrollCount / v.newCount) * 100) : 0,
                    roas: v.adSpend > 0 ? Math.round((v.revenue / v.adSpend) * 100) : 0,
                })).sort((a, b) => b.newCount - a.newCount);
                const prevMediaMap = {};
                prevMkt.forEach(d => {
                    if (!d.media) return;
                    if (!prevMediaMap[d.media]) prevMediaMap[d.media] = { adSpend: 0, newCount: 0 };
                    prevMediaMap[d.media].adSpend += d.adSpend || 0;
                    prevMediaMap[d.media].newCount += d.newCount || 0;
                });
                // 全店舗ランキング
                const allBranches = [...new Set(rawData.map(d => d.branch).filter(Boolean))];
                const branchRanking = allBranches.map(b => {
                    const bd = rawData.filter(d => d.month === latestMonth && d.branch === b);
                    const bm = mktData.filter(d => d.month === latestMonth && d.branch === b && d.media !== '全媒体合計');
                    const bSales = bd.reduce((s, d) => s + vn(d.individualSales), 0);
                    const bNew = bd.reduce((s, d) => s + vn(d.newCount), 0);
                    const bEnroll = bd.reduce((s, d) => s + vn(d.newEnroll), 0);
                    const bAdSpend = bm.reduce((s, d) => s + (d.adSpend || 0), 0);
                    const bMktNew = bm.reduce((s, d) => s + (d.newCount || 0), 0);
                    return { branch: b, sales: bSales, newCount: bNew,
                        enrollRate: bNew > 0 ? Math.round((bEnroll / bNew) * 100) : 0,
                        cpa: bMktNew > 0 ? Math.round(bAdSpend / bMktNew) : 0, adSpend: bAdSpend };
                }).sort((a, b) => b.sales - a.sales);
                // 月別トレンド（過去6ヶ月）
                const recentMonths = allMonths.slice(-6);
                const monthlyTrend = recentMonths.map(m => {
                    const md = rawData.filter(d => d.month === m).filter(branchFilter);
                    const mm = mktData.filter(d => d.month === m && d.media !== '全媒体合計').filter(mktFilter);
                    const mSales = md.reduce((s, d) => s + vn(d.individualSales), 0);
                    const mNew = md.reduce((s, d) => s + vn(d.newCount), 0);
                    const mEnroll = md.reduce((s, d) => s + vn(d.newEnroll), 0);
                    const mAdSpend = mm.reduce((s, d) => s + (d.adSpend || 0), 0);
                    const mMktNew = mm.reduce((s, d) => s + (d.newCount || 0), 0);
                    return { month: m, sales: mSales, newCount: mNew,
                        enrollRate: mNew > 0 ? Math.round((mEnroll / mNew) * 100) : 0,
                        cpa: mMktNew > 0 ? Math.round(mAdSpend / mMktNew) : 0 };
                });
                return {
                    latestMonth, prevMonth, totalSales, totalNewCount, totalNewEnroll, enrollRate,
                    churnRate, cpa, totalAdSpend, prevSales, prevNewCount,
                    mediaBreakdown, prevMediaMap, branchRanking, monthlyTrend,
                    branchName: branchName || '全店舗',
                };
            };

            // ── 事業計画: AIデータコンテキスト構築（店舗別＋他店比較） ──
            const buildPlanningContext = (question) => {
                const base = buildDataContext(question);
                const branch = planSelectedBranch;
                const a = computePlanActuals(branch);
                const goalSalesYen = planGoals.sales * 10000;
                const salesGap = goalSalesYen - a.totalSales;
                const newGap = planGoals.newCustomers - a.totalNewCount;
                const lines = [
                    '■ 事業計画：' + a.branchName + ' の目標と現在の進捗',
                    '対象月: ' + (a.latestMonth || '不明'),
                    '',
                    '【目標】',
                    '新規集客目標: ' + planGoals.newCustomers + '名',
                    '売上目標: ¥' + goalSalesYen.toLocaleString() + '（' + planGoals.sales + '万円）',
                    '入会率目標: ' + planGoals.enrollRate + '%',
                    'CPA目標: ¥' + planGoals.cpaTarget.toLocaleString(),
                    '',
                    '【' + a.branchName + 'の実績】',
                    '新規数: ' + a.totalNewCount + '名（前月: ' + a.prevNewCount + '名）',
                    '売上: ¥' + a.totalSales.toLocaleString() + '（前月: ¥' + a.prevSales.toLocaleString() + '）',
                    '入会率: ' + a.enrollRate + '%',
                    '退会率: ' + a.churnRate + '%',
                    'CPA: ¥' + a.cpa.toLocaleString(),
                    '広告費合計: ¥' + a.totalAdSpend.toLocaleString(),
                    '',
                    '【媒体別パフォーマンス（' + a.branchName + '）】',
                ];
                a.mediaBreakdown.forEach(m => {
                    const prev = a.prevMediaMap[m.media];
                    const cpaDiff = prev && prev.newCount > 0 ? '（前月CPA: ¥' + Math.round(prev.adSpend / prev.newCount).toLocaleString() + '）' : '';
                    lines.push(m.media + ': 新規' + m.newCount + '名, CPA ¥' + m.cpa.toLocaleString() + cpaDiff + ', 入会率' + m.enrollRate + '%, 広告費¥' + m.adSpend.toLocaleString() + ', ROAS ' + m.roas + '%');
                });
                lines.push('', '【他店舗との比較ランキング（' + a.latestMonth + '）】');
                a.branchRanking.forEach((b, i) => {
                    const isSelf = b.branch === branch;
                    lines.push((i + 1) + '位 ' + b.branch + (isSelf ? ' ★' : '') + ': 売上¥' + b.sales.toLocaleString() + ', 新規' + b.newCount + '名, 入会率' + b.enrollRate + '%, CPA¥' + b.cpa.toLocaleString());
                });
                lines.push('', '【月別トレンド（' + a.branchName + ' 過去6ヶ月）】');
                a.monthlyTrend.forEach(m => {
                    lines.push(m.month + ': 売上¥' + m.sales.toLocaleString() + ', 新規' + m.newCount + '名, 入会率' + m.enrollRate + '%, CPA¥' + m.cpa.toLocaleString());
                });
                lines.push('', '【ギャップ分析】');
                lines.push(salesGap > 0 ? '売上ギャップ: ¥' + salesGap.toLocaleString() + '（' + Math.round(salesGap / 10000) + '万円不足）' : '売上目標: 達成済み！');
                lines.push(newGap > 0 ? '新規ギャップ: あと' + newGap + '名必要' : '新規目標: 達成済み！');
                lines.push(a.enrollRate < planGoals.enrollRate ? '入会率ギャップ: あと' + (planGoals.enrollRate - a.enrollRate) + 'ポイント改善が必要' : '入会率目標: 達成済み！');
                lines.push(a.cpa > planGoals.cpaTarget && a.cpa > 0 ? 'CPAギャップ: ¥' + (a.cpa - planGoals.cpaTarget).toLocaleString() + '削減が必要' : 'CPA目標: 達成済み！');
                // 参考リンク
                if (planLinks.length > 0) {
                    lines.push('', '【参考リンク（回答の中で関連するものがあれば[タイトル](URL)形式のMarkdownリンクとして積極的に紹介してください）】');
                    planLinks.forEach(l => {
                        lines.push('- ' + l.title + ' (' + l.category + '): ' + l.url);
                    });
                }
                lines.push('', '【回答フォーマット指示】');
                lines.push('- Markdownで構造化して回答してください（## 見出し、**太字**、- 箇条書き、| 表 |）');
                lines.push('- コンパクトにまとめ、冗長な説明は避けてください');
                lines.push('- 参考リンクが関連する場合は[タイトル](URL)形式で本文中に自然に挿入してください');
                return lines.join('\n') + '\n\n' + base;
            };

            // ── 事業計画: AI送信 ──
            const handlePlanSubmit = async (overrideInput) => {
                const msg = (overrideInput || planInput).trim();
                if (!msg || planLoading) return;

                setPlanMessages(prev => [...prev, { type: 'user', content: msg }]);
                if (!overrideInput) setPlanInput('');
                setPlanLoading(true);

                try {
                    const dataContext = buildPlanningContext(msg);
                    const history = planMessages.map(m => ({ role: m.type === 'user' ? 'user' : 'assistant', content: m.content }));

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: '【事業計画相談: ' + (planSelectedBranch || '全店') + '】' + msg,
                            history: history.slice(-20),
                            dataContext,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.message || 'APIエラー: ' + response.status);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantText = '';
                    let buffer = '';

                    setPlanMessages(prev => [...prev, { type: 'assistant', content: '' }]);

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            try {
                                const evt = JSON.parse(line.slice(6));
                                if (evt.type === 'text') {
                                    assistantText += evt.text;
                                    const currentText = assistantText;
                                    setPlanMessages(prev => {
                                        const updated = [...prev];
                                        updated[updated.length - 1] = { type: 'assistant', content: currentText };
                                        return updated;
                                    });
                                } else if (evt.type === 'error') {
                                    throw new Error(evt.error);
                                }
                            } catch (e) {
                                if (e.message && !e.message.includes('JSON')) throw e;
                            }
                        }
                    }
                    if (!assistantText) throw new Error('応答が空でした');
                } catch (err) {
                    console.error('Plan chat error:', err);
                    setPlanMessages(prev => {
                        const last = prev[prev.length - 1];
                        const errorMsg = 'エラーが発生しました: ' + err.message;
                        if (last && last.type === 'assistant' && !last.content) {
                            const updated = [...prev];
                            updated[updated.length - 1] = { type: 'assistant', content: errorMsg };
                            return updated;
                        }
                        return [...prev, { type: 'assistant', content: errorMsg }];
                    });
                }

                setPlanLoading(false);
                setTimeout(() => {
                    if (planChatRef.current) planChatRef.current.scrollTop = planChatRef.current.scrollHeight;
                }, 100);
            };

            console.log('🎨 Rendering App - loading:', loading, 'error:', error, 'rawData length:', rawData.length);

            // ── 認証チェック中 ──
            if (isAuthChecking) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                        <div className="text-center space-y-4">
                            <Loader2 className="w-10 h-10 text-indigo-600 animate-spin mx-auto" />
                            <div className="text-slate-500 font-bold text-sm">認証確認中...</div>
                        </div>
                    </div>
                );
            }

            // ── 未認証 → ログイン画面 ──
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-100 to-indigo-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 w-full max-w-sm">
                            <div className="text-center mb-6">
                                <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                                    <span className="text-white text-2xl font-black italic">N</span>
                                </div>
                                <h1 className="text-xl font-black text-slate-800 italic">NAORU Dashboard</h1>
                                <p className="text-xs text-slate-400 mt-1">経営ダッシュボードにログイン</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4" autoComplete="on">
                                <input type="hidden" name="username" autoComplete="username" value="naoru-dashboard" />
                                <div>
                                    <input
                                        type="password"
                                        name="password"
                                        autoComplete="current-password"
                                        value={authPassword}
                                        onChange={e => setAuthPassword(e.target.value)}
                                        placeholder="パスワードを入力"
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
                                        autoFocus
                                        disabled={authLoading}
                                    />
                                </div>
                                {authError && (
                                    <div className="text-xs text-red-500 font-bold bg-red-50 rounded-lg px-3 py-2 flex items-center gap-1">
                                        <AlertCircle size={14} /> {authError}
                                    </div>
                                )}
                                <button
                                    type="submit"
                                    disabled={authLoading || !authPassword.trim()}
                                    className="w-full bg-indigo-500 text-white font-bold py-3 rounded-xl hover:bg-indigo-600 disabled:opacity-50 transition-colors text-sm"
                                >
                                    {authLoading ? 'ログイン中...' : 'ログイン'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (loading) {
                console.log('⏳ Rendering loading screen');
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                        <div className="text-center space-y-4">
                            <Loader2 className="w-12 h-12 text-indigo-600 animate-spin mx-auto" />
                            <div className="text-slate-600 font-bold tracking-wider italic">Loading Business Data...</div>
                            <div className="text-xs text-slate-400 font-mono">Check browser console for details</div>
                        </div>
                    </div>
                );
            }

            if (error && rawData.length === 0) {
                console.log('❌ Rendering error screen:', error);
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-6 rounded-xl shadow-lg text-center max-w-md w-full">
                            <AlertCircle className="w-12 h-12 text-rose-500 mx-auto mb-4" />
                            <h3 className="text-lg font-bold text-slate-800 mb-2">Data Load Error</h3>
                            <p className="text-slate-600 mb-4 text-sm">{error}</p>
                            <details className="mb-4 text-left">
                                <summary className="cursor-pointer text-xs text-slate-500 hover:text-slate-700">Technical Details</summary>
                                <pre className="mt-2 p-2 bg-slate-50 rounded text-xs overflow-auto">{error}</pre>
                            </details>
                            <button
                                onClick={() => { setError(null); fetchDataFromSpreadsheet(true); }}
                                className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-bold text-sm"
                            >
                                Retry Connection
                            </button>
                        </div>
                    </div>
                );
            }

            console.log('✅ Rendering main dashboard');

            return (
                <div className="min-h-screen bg-slate-50 flex">
                    {/* Sidebar */}
                    <Sidebar currentPage={currentPage} setCurrentPage={setCurrentPage} handleLogout={handleLogout} cpaAlerts={cpaAlerts} alertOpen={alertOpen} setAlertOpen={setAlertOpen} alertRef={alertRef} />

                    {/* Main Content */}
                    <div className="flex-1 overflow-x-hidden pb-16 md:pb-0">
                        {currentPage === 'dashboard' && (
                            <div className="p-3 md:p-4 lg:p-6 font-sans text-slate-900">
                                <div className="max-w-[1600px] mx-auto space-y-4 md:space-y-6">

                        {/* Filter Header */}
                        <header className="flex flex-col gap-3 md:gap-4 bg-white p-3 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-200">
                            <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3 md:gap-6">
                                <div className="space-y-1 flex-1">
                                    <div className="inline-flex items-center gap-2 px-2 md:px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-[10px] md:text-xs font-black uppercase tracking-widest mb-1">
                                        <Activity size={12} className="md:hidden" /><Activity size={14} className="hidden md:block" /> Analytics Dashboard
                                    </div>
                                    <h1 className="text-xl md:text-3xl font-black tracking-tight text-slate-900 italic">経営指標</h1>
                                </div>

                                {/* Mobile View Toggle */}
                                <button
                                    onClick={() => setIsMobileView(!isMobileView)}
                                    className={`hidden md:flex px-4 py-2 rounded-xl font-bold text-sm items-center gap-2 transition-all ${
                                        isMobileView
                                            ? 'bg-indigo-600 text-white shadow-lg'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    {isMobileView ? '📱 モバイル' : '💻 デスクトップ'}
                                </button>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 md:gap-3">
                                <div className="flex flex-col gap-1">
                                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest px-1">期間選択</span>
                                    <DateRangePicker
                                        startDate={startDate}
                                        endDate={endDate}
                                        onDateChange={(start, end) => {
                                            setStartDate(start);
                                            setEndDate(end);

                                            // 日付範囲から対象月を計算
                                            if (start && end) {
                                                const getMonthString = (date) => {
                                                    return `${date.getFullYear()}年${date.getMonth() + 1}月`;
                                                };

                                                const startMonthStr = getMonthString(start);
                                                const endMonthStr = getMonthString(end);

                                                setStartMonth(startMonthStr);
                                                setEndMonth(endMonthStr);
                                            }
                                        }}
                                        months={months}
                                    />
                                </div>

                                <div className="flex flex-col gap-1 min-w-0 w-full sm:min-w-[220px] sm:w-auto relative" ref={branchMenuRef}>
                                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest px-1">店舗選択</span>
                                    <button
                                        onClick={() => setIsBranchMenuOpen(!isBranchMenuOpen)}
                                        className="bg-slate-50 border border-slate-200 rounded-xl px-3 md:px-4 py-2 md:py-2.5 text-sm md:text-base font-bold flex items-center justify-between gap-2 hover:bg-slate-100 transition-colors shadow-sm"
                                    >
                                        <span className="truncate">
                                            {selectedBranches.length === allBranches.length ? "全店舗" :
                                            selectedBranches.length === 0 ? "未選択" :
                                            `${selectedBranches[0]}${selectedBranches.length > 1 ? ` 他${selectedBranches.length - 1}件` : ''}`}
                                        </span>
                                        <ChevronDown size={18} className={`transition-transform flex-shrink-0 ${isBranchMenuOpen ? 'rotate-180' : ''}`} />
                                    </button>
                                    {isBranchMenuOpen && (
                                        <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 p-3 space-y-2 max-h-[300px] md:max-h-[400px] overflow-hidden flex flex-col">

        // 日付範囲選択コンポーネント（改良版）
        const DateRangePicker = ({ startDate, endDate, onDateChange, months }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [selectingStart, setSelectingStart] = useState(true);
            const pickerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (pickerRef.current && !pickerRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            // 月の日付を生成
            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();

                const days = [];
                for (let i = 0; i < startingDayOfWeek; i++) {
                    days.push(null);
                }
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(new Date(year, month, i));
                }
                return days;
            };

            const formatDate = (date) => {
                if (!date) return '';
                return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
            };

            const formatDateJa = (date) => {
                if (!date) return '';
                return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
            };

            const handleDateClick = (date) => {
                if (!date) return;

                if (selectingStart) {
                    // 開始日を選択中：終了日が開始日より前になる場合は終了日もリセット
                    if (endDate && date > endDate) {
                        onDateChange(date, date);
                    } else {
                        onDateChange(date, endDate);
                    }
                } else {
                    // 終了日を選択中：開始日より前の日付を選んだ場合は入れ替え
                    if (startDate && date < startDate) {
                        onDateChange(date, startDate);
                    } else {
                        onDateChange(startDate, date);
                    }

                const change = prevMonth !== 0 ? ((lastMonth - prevMonth) / prevMonth * 100).toFixed(1) : 0;

                return {
                    monthlyData: monthly,
                    totalValue: total,
                    lastMonthValue: lastMonth,
                    prevMonthValue: prevMonth,

            // データ計算とサマリー統計

                const monthlyG = {};
                const monthlyH = {};
                targetMonths.forEach(month => {

                    monthlyG[month] = monthData.reduce((sum, d) => sum + (d.gReviews || 0), 0);

                const gValues = targetMonths.map(m => monthlyG[m] || 0);

                const gTotal = gValues.reduce((sum, v) => sum + v, 0);

                const lastG = gValues[gValues.length - 1] || 0;
