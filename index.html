            );
        };

        // --- Sub-Components ---

        // 日付範囲選択コンポーネント（改良版）
        const DateRangePicker = ({ startDate, endDate, onDateChange, months }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [selectingStart, setSelectingStart] = useState(true);
            const pickerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (pickerRef.current && !pickerRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            // 月の日付を生成
            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();

                const days = [];
                for (let i = 0; i < startingDayOfWeek; i++) {
                    days.push(null);
                }
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(new Date(year, month, i));
                }
                return days;
            };

            const formatDate = (date) => {
                if (!date) return '';
                return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
            };

            const formatDateJa = (date) => {
                if (!date) return '';
                return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
            };

            const handleDateClick = (date) => {
                if (!date) return;

                if (selectingStart) {
                    // 開始日を選択中：終了日が開始日より前になる場合は終了日もリセット
                    if (endDate && date > endDate) {
                        onDateChange(date, date);
                    } else {
                        onDateChange(date, endDate);
                    }
                } else {
                    // 終了日を選択中：開始日より前の日付を選んだ場合は入れ替え
                    if (startDate && date < startDate) {
                        onDateChange(date, startDate);
                    } else {
                        onDateChange(startDate, date);
                    }
                }
            };

            const isDateInRange = (date) => {
                if (!date || !startDate || !endDate) return false;
                return date >= startDate && date <= endDate;
            };

            const isStartDate = (date) => {
                if (!date || !startDate) return false;
                return date.toDateString() === startDate.toDateString();
            };

            const isEndDate = (date) => {
                if (!date || !endDate) return false;
                return date.toDateString() === endDate.toDateString();
            };

            const previousMonth = () => {
                setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1));
            };

            const nextMonth = () => {
                setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1));
            };

            const days = getDaysInMonth(viewDate);
            const weekDays = ['日', '月', '火', '水', '木', '金', '土'];

            return (
                <div className="relative" ref={pickerRef}>
                    {/* メインボタン - 開始日と終了日を分けて表示 */}
                    <div className="flex bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button
                            onClick={() => { setIsOpen(true); setSelectingStart(true); }}
                            className={`flex-1 px-3 py-2.5 text-sm font-bold flex items-center gap-2 transition-all border-r border-slate-200 ${
                                isOpen && selectingStart ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-slate-100'
                            }`}
                        >
                            <Calendar size={16} className={isOpen && selectingStart ? 'text-indigo-500' : 'text-slate-400'} />
                            <div className="text-left">
                                <div className="text-[10px] text-slate-400 uppercase tracking-wider">開始日</div>
                                <div className={isOpen && selectingStart ? 'text-indigo-700' : 'text-slate-900'}>
                                    {startDate ? formatDateJa(startDate) : '選択してください'}
                                </div>
                            </div>
                        </button>
                        <button
                            onClick={() => { setIsOpen(true); setSelectingStart(false); }}
                            className={`flex-1 px-3 py-2.5 text-sm font-bold flex items-center gap-2 transition-all ${
                                isOpen && !selectingStart ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-slate-100'
                            }`}
                        >
                            <Calendar size={16} className={isOpen && !selectingStart ? 'text-indigo-500' : 'text-slate-400'} />
                            <div className="text-left">
                                <div className="text-[10px] text-slate-400 uppercase tracking-wider">終了日</div>
                                <div className={isOpen && !selectingStart ? 'text-indigo-700' : 'text-slate-900'}>
                                    {endDate ? formatDateJa(endDate) : '選択してください'}
                                </div>
                            </div>
                        </button>
                    </div>

                    {isOpen && (
                        <div className="absolute top-full left-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 p-4 min-w-[380px]">
                            {/* 選択モード表示 */}
                            <div className="flex gap-2 mb-4">
                                <button
                                    onClick={() => setSelectingStart(true)}
                                    className={`flex-1 px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                                        selectingStart
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    開始日を選択
                                </button>
                                <button
                                    onClick={() => setSelectingStart(false)}
                                    className={`flex-1 px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                                        !selectingStart
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    終了日を選択
                                </button>
                            </div>

                            {/* カレンダーヘッダー */}
                            <div className="flex items-center justify-between mb-4">
                                <button onClick={previousMonth} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <ChevronDown size={20} className="rotate-90" />
                                </button>
                                <div className="text-lg font-black">
                                    {viewDate.getFullYear()}年{viewDate.getMonth() + 1}月
                                </div>
                                <button onClick={nextMonth} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                                    <ChevronDown size={20} className="-rotate-90" />
                                </button>
                            </div>

                            {/* 曜日ヘッダー */}
                            <div className="grid grid-cols-7 gap-1 mb-2">
                                {weekDays.map(day => (
                                    <div key={day} className="text-center text-xs font-black text-slate-400 py-1">
                                        {day}
                                    </div>
                                ))}
                            </div>

                            {/* カレンダー日付 */}
                            <div className="grid grid-cols-7 gap-1">
                                {days.map((date, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleDateClick(date)}
                                        disabled={!date}
                                        className={`
                                            aspect-square p-2 text-sm font-bold rounded-lg transition-all
                                            ${!date ? 'invisible' : ''}
                                            ${isStartDate(date) ? 'bg-emerald-500 text-white ring-2 ring-emerald-300' : ''}
                                            ${isEndDate(date) && !isStartDate(date) ? 'bg-rose-500 text-white ring-2 ring-rose-300' : ''}
                                            ${isDateInRange(date) && !isStartDate(date) && !isEndDate(date) ? 'bg-indigo-100 text-indigo-700' : ''}
                                            ${!isStartDate(date) && !isEndDate(date) && !isDateInRange(date) && date ? 'hover:bg-slate-100 text-slate-700' : ''}
                                            ${date && date.toDateString() === new Date().toDateString() && !isStartDate(date) && !isEndDate(date) ? 'ring-2 ring-slate-300' : ''}
                                        `}
                                    >
                                        {date ? date.getDate() : ''}
                                    </button>
                                ))}
                            </div>

                            {/* 凡例 */}
                            <div className="mt-4 pt-3 border-t border-slate-200 flex items-center justify-center gap-4 text-xs font-bold">
                                <div className="flex items-center gap-1">
                                    <div className="w-3 h-3 rounded bg-emerald-500"></div>
                                    <span className="text-slate-600">開始日</span>
                                </div>
                                <div className="flex items-center gap-1">
                                    <div className="w-3 h-3 rounded bg-rose-500"></div>
                                    <span className="text-slate-600">終了日</span>
                                </div>
                                <div className="flex items-center gap-1">
                                    <div className="w-3 h-3 rounded bg-indigo-200"></div>
                                    <span className="text-slate-600">期間内</span>
                                </div>
                            </div>

                            {/* クイック選択ボタン */}
                            <div className="mt-4 grid grid-cols-4 gap-2">
                                <button
                                    onClick={() => {
                                        const today = new Date();
                                        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                                        onDateChange(firstDay, today);
                                    }}
                                    className="px-2 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors"
                                >
                                    今月
                                </button>
                                <button
                                    onClick={() => {
                                        const today = new Date();
                                        const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                                        const lastDayOfLastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                                        onDateChange(lastMonth, lastDayOfLastMonth);
                                    }}
                                    className="px-2 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors"
                                >
                                    先月
                                </button>
                                <button
                                    onClick={() => {
                                        const today = new Date();
                                        const threeMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 2, 1);
                                        onDateChange(threeMonthsAgo, today);
                                    }}
                                    className="px-2 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors"
                                >
                                    3ヶ月
                                </button>
                                <button
                                    onClick={() => {
                                        const today = new Date();
                                        const yearStart = new Date(today.getFullYear(), 0, 1);
                                        onDateChange(yearStart, today);
                                    }}
                                    className="px-2 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition-colors"
                                >
                                    今年
                                </button>
                            </div>

                            {/* 閉じるボタン */}
                            <button
                                onClick={() => setIsOpen(false)}
                                className="mt-4 w-full py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition-colors"
                            >
                                適用して閉じる
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 汎用チャートコンポーネント（ピッチ資料レベル）
        const ChartCard = ({ title, icon, data, targetMonths, type, dataKey, label, color, aggregation = 'average', isCurrency = true }) => {
            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);

            // データ計算とサマリー統計
            const { monthlyData, totalValue, lastMonthValue, prevMonthValue, changePercent } = useMemo(() => {
                const monthly = {};
                targetMonths.forEach(month => {
                    const monthData = data.filter(d => d.month === month);
                    if (monthData.length > 0) {
                        const total = monthData.reduce((sum, d) => sum + (d[dataKey] || 0), 0);
                        monthly[month] = aggregation === 'sum' ? total : Math.round(total / monthData.length);
                    } else {
                        monthly[month] = 0;
                    }
                });

                const values = targetMonths.map(m => monthly[m] || 0);
                const total = values.reduce((sum, v) => sum + v, 0);
                const lastMonth = values[values.length - 1] || 0;
                const prevMonth = values[values.length - 2] || 0;
                const change = prevMonth !== 0 ? ((lastMonth - prevMonth) / prevMonth * 100).toFixed(1) : 0;

                return {
                    monthlyData: monthly,
                    totalValue: total,
                    lastMonthValue: lastMonth,
                    prevMonthValue: prevMonth,
                    changePercent: change
                };
            }, [data, targetMonths, dataKey, aggregation]);

            useEffect(() => {
                if (!chartRef.current || !data || targetMonths.length === 0) return;

                // 既存のチャートを破棄
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                const chartData = targetMonths.map(m => monthlyData[m] || 0);

                chartInstanceRef.current = new Chart(ctx, {
                    type: type,
                    data: {
                        labels: targetMonths,
                        datasets: [{
                            label: label,
                            data: chartData,
                            backgroundColor: type === 'bar'
                                ? chartData.map(val => color.replace('rgb', 'rgba').replace(')', ', 0.7)'))
                                : color.replace('rgb', 'rgba').replace(')', ', 0.15)'),
                            borderColor: color,
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            pointBackgroundColor: '#ffffff',
                            pointBorderWidth: 3,
                            pointHoverBorderWidth: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                padding: 12,
                                titleFont: {
                                    size: 14,
                                    weight: 'bold'
                                },
                                bodyFont: {
                                    size: 16,
                                    weight: 'bold'
                                },
                                callbacks: {
                                    label: function(context) {
                                        if (isCurrency) {
                                            return label + ': ¥' + context.parsed.y.toLocaleString();
                                        }
                                        return label + ': ' + context.parsed.y.toLocaleString();
                                    }
                                }
                            },
                            datalabels: {
                                display: true,
                                color: '#1e293b',
                                font: {
                                    weight: 'bold',
                                    size: 11
                                },
                                formatter: function(value) {
                                    if (isCurrency) {
                                        return '¥' + (value / 10000).toFixed(0) + '万';
                                    }
                                    return value.toLocaleString();
                                },
                                anchor: 'end',
                                align: 'top',
                                offset: 4
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    font: {
                                        size: 11,
                                        weight: 'bold'
                                    },
                                    autoSkip: false,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                },
                                ticks: {
                                    font: {
                                        size: 12,
                                        weight: 'bold'
                                    },
                                    callback: function(value) {
                                        if (isCurrency) {
                                            return '¥' + (value / 10000).toFixed(0) + '万';
                                        }
                                        return value.toLocaleString();
                                    }
                                }
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                    }
                };
            }, [data, targetMonths, type, dataKey, monthlyData, isCurrency]);

            const formatValue = (val) => {
                if (isCurrency) {
                    return '¥' + val.toLocaleString();
                }
                return val.toLocaleString();
            };

            return (
                <div className="bg-white rounded-3xl shadow-lg border-2 border-slate-200 overflow-hidden hover:shadow-xl transition-shadow">
                    <div className="bg-gradient-to-r from-indigo-50 to-blue-50 p-6 border-b-2 border-slate-200">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-3">
                                <div className="text-indigo-600 bg-white p-3 rounded-xl shadow-sm">{icon}</div>
                                <h3 className="text-2xl font-black text-slate-900">{title}</h3>
                            </div>
                        </div>

                        {/* サマリー統計 */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4">
                            <div className="bg-white p-4 rounded-xl shadow-sm">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-wider mb-1">
                                    {aggregation === 'sum' ? '合計' : '期間平均'}
                                </div>
                                <div className="text-xl font-black text-slate-900">{formatValue(aggregation === 'sum' ? totalValue : Math.round(totalValue / targetMonths.length))}</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-wider mb-1">最新月</div>
                                <div className="text-xl font-black text-slate-900">{formatValue(lastMonthValue)}</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm">
                                <div className="text-xs font-black text-slate-400 uppercase tracking-wider mb-1">前月比</div>
                                <div className={`text-xl font-black ${changePercent >= 0 ? 'text-emerald-600' : 'text-rose-600'} flex items-center gap-1`}>
                                    {changePercent >= 0 ? <TrendingUp size={20} /> : <TrendingDown size={20} />}
                                    {changePercent >= 0 ? '+' : ''}{changePercent}%
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="p-6">
                        <div style={{ height: '500px' }}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        };

        // 店舗別売上チャート（ピッチ資料レベル）
        const BranchSalesChart = ({ data, targetMonths, selectedBranches }) => {
            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);

            // データ計算とサマリー統計
            const { branchMonthlyData, branchTotals } = useMemo(() => {
                const monthly = {};
                const totals = {};

                selectedBranches.forEach(branch => {
                    monthly[branch] = {};
                    let total = 0;
                    targetMonths.forEach(month => {
                        const monthData = data.filter(d => d.branch === branch && d.month === month);
                        const monthTotal = monthData.reduce((sum, d) => sum + (d.individualSales || 0), 0);
                        monthly[branch][month] = monthTotal;
                        total += monthTotal;
                    });
                    totals[branch] = total;
                });

                return {
                    branchMonthlyData: monthly,
                    branchTotals: totals
                };
            }, [data, targetMonths, selectedBranches]);

            useEffect(() => {
                if (!chartRef.current || !data || targetMonths.length === 0) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const colors = [
                    'rgb(59, 130, 246)',
                    'rgb(16, 185, 129)',
                    'rgb(251, 146, 60)',
                    'rgb(139, 92, 246)',
                    'rgb(236, 72, 153)',
                    'rgb(245, 158, 11)'
                ];

                const datasets = selectedBranches.map((branch, idx) => ({
                    label: branch,
                    data: targetMonths.map(m => branchMonthlyData[branch][m] || 0),
                    backgroundColor: colors[idx % colors.length].replace('rgb', 'rgba').replace(')', ', 0.15)'),
                    borderColor: colors[idx % colors.length],
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointRadius: 5,
                    pointHoverRadius: 7,
                    pointBackgroundColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointHoverBorderWidth: 3
                }));

                const ctx = chartRef.current.getContext('2d');
                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: targetMonths,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    font: {
                                        size: 14,
                                        weight: 'bold'
                                    },
                                    padding: 15,
                                    usePointStyle: true,
                                    pointStyle: 'circle'
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                padding: 12,
                                titleFont: {
                                    size: 14,
                                    weight: 'bold'

            const root = createRoot(container);
            console.log('✅ React root created');
            console.log('🎨 Rendering App component...');

            root.render(<App />);
            console.log('✅ App component rendered successfully');
        } catch (error) {
            console.error('❌ Fatal error during React initialization:', error);
            const container = document.getElementById('root');
            if (container) {
                container.innerHTML = `

                            <p style="color: #64748b; margin-bottom: 16px; font-size: 14px;">アプリケーションの初期化中に致命的なエラーが発生しました。</p>

                                <pre style="color: #7f1d1d; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; margin: 0;">${error.message}\n\n${error.stack || ''}</pre>
                            </div>
                            <div style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                                <p style="color: #475569; font-size: 13px; font-weight: bold; margin-bottom: 8px;">トラブルシューティング:</p>
                                <ul style="color: #64748b; font-size: 13px; margin: 0; padding-left: 20px;">
                                    <li>ブラウザのコンソールを開いて詳細なエラーを確認してください</li>
                                    <li>ブラウザのキャッシュをクリアしてください</li>
                                    <li>別のブラウザで試してみてください</li>
                                    <li>インターネット接続を確認してください</li>
                                </ul>
                            </div>
                            <button onclick="location.reload()" style="width: 100%; padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;">
                                ページを再読み込み
                            </button>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
